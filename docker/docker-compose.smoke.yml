version: "3.8"

x-common-env: &common-env
  MONGODB_URI: ${MONGODB_URI}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: smokepass123
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: smokepass123
  SPRING_DATA_REDIS_USERNAME: default
  SPRING_PROFILES_ACTIVE: default,kafka-disabled
  GOGIDIX_JWT_SECRET: smoke-test-secret-key-at-least-256-bits-long-for-hs256-algorithm
  JAVA_OPTS: "-Xmx200m -Xms64m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom -Dspring.jmx.enabled=false"

x-common-healthcheck: &common-healthcheck
  interval: 15s
  timeout: 5s
  retries: 30
  start_period: 120s

services:
  redis:
    image: redis:7-alpine
    container_name: smoke-redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass smokepass123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "smokepass123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  service-registry:
    ports:
      - "8761:8761"
    mem_limit: 300m
    image: ${GHCR_REPO}-service-registry-discovery:${IMAGE_TAG}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      SERVER_PORT: "8761"
      MONGODB_DATABASE: rapid_assist_service_registry
      SPRING_DATA_MONGODB_DATABASE: rapid_assist_service_registry
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8761/actuator/health"]

  config-service:
    ports:
      - "8080:8080"
    mem_limit: 300m
    image: ${GHCR_REPO}-config-service:${IMAGE_TAG}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      MONGODB_DATABASE: rapid_assist_config
      SPRING_DATA_MONGODB_DATABASE: rapid_assist_config
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]

  api-gateway:
    ports:
      - "8304:8304"
    mem_limit: 512m
    image: ${GHCR_REPO}-api-gateway:${IMAGE_TAG}
    depends_on:
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      <<: *common-env
      SERVER_PORT: "8304"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      JAVA_OPTS: "-Xmx320m -Xms64m -XX:+UseG1GC -XX:MaxMetaspaceSize=128m -Djava.security.egd=file:/dev/./urandom -Dspring.jmx.enabled=false"
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8304/actuator/health"]

  tenant-org-service:
