version: "3.8"

x-common-env: &common-env
  MONGODB_URI: ${MONGODB_URI}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: smokepass123
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: smokepass123
  SPRING_DATA_REDIS_USERNAME: default
  SPRING_PROFILES_ACTIVE: default

x-common-healthcheck: &common-healthcheck
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 60s

services:
  redis:
    image: redis:7-alpine
    container_name: smoke-redis
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass smokepass123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "smokepass123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  service-registry:
    image: ${GHCR_REPO}-service-registry-discovery:${IMAGE_TAG}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      SERVER_PORT: "8761"
      MONGODB_DATABASE: rapid_assist_service_registry
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8761/actuator/health"]

  config-service:
    image: ${GHCR_REPO}-config-service:${IMAGE_TAG}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      MONGODB_DATABASE: rapid_assist_config
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]

  api-gateway:
