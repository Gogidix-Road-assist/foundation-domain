version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: smoke-redis
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass smokepass123
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "smokepass123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  service-registry:
    image: ${GHCR_REPO}/service-registry-discovery:${IMAGE_TAG}
    container_name: smoke-service-registry
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=rapid_assist_service_registry
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=smokepass123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=smokepass123
      - SPRING_DATA_REDIS_USERNAME=default
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  config-service:
    image: ${GHCR_REPO}/config-service:${IMAGE_TAG}
    container_name: smoke-config-service
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=smokepass123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=smokepass123
      - SPRING_DATA_REDIS_USERNAME=default
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  tenant-org-service:
    image: ${GHCR_REPO}/tenant-org-service:${IMAGE_TAG}
    container_name: smoke-tenant-org-service
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=rapid_assist_tenant_org
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=smokepass123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=smokepass123
      - SPRING_DATA_REDIS_USERNAME=default
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  monitoring-service:
    image: ${GHCR_REPO}/monitoring-service:${IMAGE_TAG}
    container_name: smoke-monitoring-service
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8091:8091"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=smokepass123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=smokepass123
      - SPRING_DATA_REDIS_USERNAME=default
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  dashboard-configuration-service:
    image: ${GHCR_REPO}/dashboard-configuration-service:${IMAGE_TAG}
    container_name: smoke-dashboard-configuration-service
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8200:8200"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=rapid_assist_dashboard_config
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=smokepass123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=smokepass123
      - SPRING_DATA_REDIS_USERNAME=default
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8200/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
