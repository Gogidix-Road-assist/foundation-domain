version: "3.8"

services:
  service-registry:
    image: ghcr.io/${REPO}/service-registry-discovery:${SHA}
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_PORT=8761
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=rapid_assist_service_registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  config-service:
    image: ghcr.io/${REPO}/config-service:${SHA}
    container_name: config-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      service-registry:
        condition: service_healthy
    restart: unless-stopped

  tenant-org-service:
    image: ghcr.io/${REPO}/tenant-org-service:${SHA}
    container_name: tenant-org-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=rapid_assist_tenant_org
    depends_on:
      service-registry:
        condition: service_healthy
    restart: unless-stopped

  monitoring-service:
    image: ghcr.io/${REPO}/monitoring-service:${SHA}
    container_name: monitoring-service
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      service-registry:
        condition: service_healthy
    restart: unless-stopped

  dashboard-configuration-service:
    image: ghcr.io/${REPO}/dashboard-configuration-service:${SHA}
    container_name: dashboard-configuration-service
    ports:
      - "8200:8200"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=rapid_assist_dashboard_config
    depends_on:
      service-registry:
        condition: service_healthy
    restart: unless-stopped
