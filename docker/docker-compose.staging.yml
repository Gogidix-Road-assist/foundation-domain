version: "3.8"

x-common-env: &common-env
  MONGODB_URI: ${MONGODB_URI}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  SPRING_PROFILES_ACTIVE: production

x-common-healthcheck: &common-healthcheck
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 120s

services:
  redis:
    image: redis:7-alpine
    container_name: staging-redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  service-registry:
    image: ghcr.io/${REPO}/service-registry-discovery:${SHA}
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      <<: *common-env
      MONGODB_DATABASE: rapid_assist_service_registry
      SPRING_DATA_MONGODB_DATABASE: rapid_assist_service_registry
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]

  config-service:
    image: ghcr.io/${REPO}/config-service:${SHA}
    container_name: config-service
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      MONGODB_DATABASE: rapid_assist_config
      SPRING_DATA_MONGODB_DATABASE: rapid_assist_config
    depends_on:
      service-registry:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]

  api-gateway:
    image: ghcr.io/${REPO}/api-gateway:${SHA}
