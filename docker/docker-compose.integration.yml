version: "3.8"

x-common-env: &common-env
  MONGODB_URI: ${MONGODB_URI}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: smokepass123
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: smokepass123
  SPRING_DATA_REDIS_USERNAME: default
  SPRING_PROFILES_ACTIVE: default
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JAVA_OPTS: "-Xmx200m -Xms64m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom -Dspring.jmx.enabled=false"

x-common-healthcheck: &common-healthcheck
  interval: 15s
  timeout: 5s
  retries: 30
  start_period: 120s

services:
  redis:
    image: redis:7-alpine
    container_name: integration-redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass smokepass123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "smokepass123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: integration-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: integration-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  dashboard-configuration-service:
    image: ghcr.io/gogidix-road-assist/foundation-domain-dashboard-configuration-service:latest
    container_name: integration-dashboard-configuration-service
    environment:
      <<: *common-env
    ports:
      - "8200:8200"
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8200/actuator/health"]
      <<: *common-healthcheck
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  country-aggregation-service:
    image: ghcr.io/gogidix-road-assist/foundation-domain-country-aggregation-service:latest
    container_name: integration-country-aggregation-service
