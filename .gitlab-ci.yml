stages:
  - build
  - test
  - deploy

variables:
  MAVEN_OPTS: "-Xmx1024m"

publish-shared-libraries:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: false
  script:
    - mvn install -DskipTests -N -q
    - cd shared-libraries/Backend/Java
    - mvn clean install -DskipTests -q

build-services:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  needs: [publish-shared-libraries]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: false
  script:
    - mvn install -DskipTests -N -q
    - cd shared-libraries/Backend/Java && mvn clean install -DskipTests -q && cd $CI_PROJECT_DIR
    - mvn clean package -DskipTests -q
  artifacts:
    paths:
      - "**/target/*.jar"
    expire_in: 1 day

test-services:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  needs: [publish-shared-libraries]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
  services:
    - name: mongo:7
      alias: mongodb
  variables:
    MONGODB_URI: "mongodb://mongodb:27017/test"
  script:
    - mvn install -DskipTests -N -q
    - cd shared-libraries/Backend/Java && mvn clean install -DskipTests -q && cd $CI_PROJECT_DIR
    - mvn test -U

promote-staging:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: false
  script:
    - apk add --no-cache git
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@gogidix.com"
    - git fetch origin staging/uat || true
    - git checkout -B staging/uat origin/dev
    - git push -f origin staging/uat
  environment:
    name: staging/uat

promote-production:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "staging/uat"
      when: manual
      allow_failure: false
  script:
    - apk add --no-cache git
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@gogidix.com"
    - git fetch origin production || true
    - git checkout -B production origin/staging/uat
    - git push -f origin production
  environment:
    name: production
