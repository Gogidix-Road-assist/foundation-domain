    - cd shared-infrastructure/Backend/Java
    - mvn clean package -DskipTests
    - mvn test org.jacoco:jacoco-maven-plugin:report
  services:
    - name: mongo:7
      alias: mongodb
  variables:
    MONGODB_URI: "mongodb://mongodb:27017/test"

