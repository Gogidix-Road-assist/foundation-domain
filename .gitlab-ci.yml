shared-models:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  needs: [publish-shared-libraries]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: false
  script:
    - *maven_setup
    - mvn install -U -DskipTests -N -q
    - cd shared-libraries && mvn clean install -U -DskipTests -q && cd $CI_PROJECT_DIR
    - |
      for svc in shared-libraries/shared-models/*/; do
        if [ -f "${svc}pom.xml" ]; then
          echo "Building $(basename ${svc})..."
          mvn clean package -DskipTests -f "${svc}pom.xml"
        fi
      done
    - |
      for svc in shared-libraries/shared-models/*/; do
        if [ -f "${svc}pom.xml" ]; then
          echo "Testing $(basename ${svc})..."
          mvn test org.jacoco:jacoco-maven-plugin:report -f "${svc}pom.xml"
        fi
      done

code-quality:
  stage: quality
  image: returntocorp/semgrep:latest
  needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, shared-models]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
  script:
    - semgrep --config auto --json -o semgrep-report.json . || true
    - semgrep --config auto .
  allow_failure: false

security-scan:
  stage: security
  image:
    name: trufflesecurity/trufflehog:3.95.5
    entrypoint: [""]
  needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, shared-models]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
  script:
    - trufflehog git file://. --only-verified

docker-build:
  stage: docker
  image: maven:3.9-eclipse-temurin-21
  needs: [code-quality, security-scan]
  tags: [docker]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_API_VERSION: "1.43"
  before_script:
    - docker system prune -af --volumes 2>/dev/null || true
    - *maven_setup
    - apt-get update -qq && apt-get install -qq -y docker.io > /dev/null 2>&1
    - echo "$GITHUB_TOKEN" | docker login -u "$GITHUB_ACTOR" --password-stdin ghcr.io
  script:
    - SHORT_SHA="${CI_COMMIT_SHA:0:7}"
    - ORG_LOWER="gogidix-road-assist"
    - REPO_NAME="foundation-domain"
    - GHCR_PREFIX="ghcr.io/${ORG_LOWER}/${REPO_NAME}"
    - mvn clean package -U -DskipTests -q
    - |
      declare -A SERVICE_PORTS=(
        [service-registry-discovery]=8761
        [config-service]=8080
        [api-gateway]=8304
        [tenant-org-service]=8085
        [monitoring-service]=8091
        [dashboard-configuration-service]=8200
        [feature-flags-service]=8100
        [dynamic-routing-config-service]=8102
        [rate-limit-policy-service]=8104
        [release-rollout-config-service]=8105
        [tenancy-configuration-service]=8106
        [dashboard-analytics-service]=8201
        [dashboard-reporting-service]=8202
        [country-aggregation-service]=8095
        [executive-aggregation-service]=8096
        [common-domain-models]=8261
        [country-localization-config-service]=8262
        [user-profile-service]=8310
        [database-indexing-service]=8090
        [access-control-service]=8311
        [alerting-service]=8312
        [api-keys-service]=8313
        [audit-correlation-service]=8314
        [database-management-service]=8315
        [event-audit-service]=8316
        [idempotency-service]=8317
        [identity-access-service]=8318
        [identity-service]=8319
        [integration-adapters-service]=8320
        [logging-aggregation-service]=8321
        [metrics-telemetry-service]=8324
        [mfa-service]=8325
        [rate-limiting-service]=8326
        [request-routing-service]=8327
        [service-health-monitor]=8328
        [service-health-monitor-service]=8329
        [session-token-service]=8330
        [waf-policy-service]=8331
        [event-schemas]=8332
      )
    - |
      DOCKERFILE=docker/Dockerfile.service
      if [ ! -f "$DOCKERFILE" ]; then
        echo "Dockerfile not found"
        exit 1
      fi
      docker_push() {
        local image="$1"
        for attempt in 1 2 3 4 5; do
          if docker push "$image"; then return 0; fi
          echo "WARN: push attempt ${attempt} failed for ${image}, retrying in 10s..."
          sleep 10
        done
        echo "ERROR: failed to push ${image} after 5 attempts"
        return 1
      }
      BUILD_LIST=""
      IMAGE_COUNT=0
      while read jar; do
        SERVICE_NAME=$(basename "$jar" | sed 's/-[0-9].*//')
        IMAGE_NAME=$(echo "$SERVICE_NAME" | tr '_' '-' | tr '[:upper:]' '[:lower:]')
        PORT=${SERVICE_PORTS[$SERVICE_NAME]:-8080}
        GHCR_IMAGE="${GHCR_PREFIX}-${IMAGE_NAME}"
        BUILD_CTX=$(mktemp -d)
        cp "$jar" "$BUILD_CTX/app.jar"
        cp "$DOCKERFILE" "$BUILD_CTX/Dockerfile"
        echo "Building ${IMAGE_NAME} (port ${PORT})"
        docker build --build-arg SERVICE_PORT="${PORT}" \
          -t "${GHCR_IMAGE}:${CI_COMMIT_SHA}" \
          -t "${GHCR_IMAGE}:${SHORT_SHA}" \
          "$BUILD_CTX"
        BUILD_LIST="${BUILD_LIST} ${GHCR_IMAGE}"
        IMAGE_COUNT=$((IMAGE_COUNT + 1))
        rm -rf "$BUILD_CTX"
      done < <(find . -name "*.jar" -path "*/target/*" ! -name "original-*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -path "*/shared-libraries/Backend/Java/*")
      if [ "$IMAGE_COUNT" -eq 0 ]; then
        echo "ERROR: No Docker images built"
        exit 1
      fi
      echo "Built ${IMAGE_COUNT} images, pushing to GHCR..."
      PUSH_FAIL=0
      for GHCR_IMAGE in $BUILD_LIST; do
        docker_push "${GHCR_IMAGE}:${CI_COMMIT_SHA}" || PUSH_FAIL=$((PUSH_FAIL + 1))
        docker_push "${GHCR_IMAGE}:${SHORT_SHA}" || PUSH_FAIL=$((PUSH_FAIL + 1))
      done
      docker system prune -af 2>/dev/null || true
      if [ "$PUSH_FAIL" -gt 0 ]; then
        echo "ERROR: ${PUSH_FAIL} push operations failed"
        exit 1
      fi
      echo "All ${IMAGE_COUNT} images pushed successfully"

smoke-test:
  stage: smoke
  image: docker:24.0.5
  needs: [docker-build]
  tags: [docker]
  timeout: 1h
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_API_VERSION: "1.43"
    RUNNER_SCRIPT_TIMEOUT: 55m
  before_script:
    - docker system prune -af --volumes 2>/dev/null || true
  script:
    - SHORT_SHA="${CI_COMMIT_SHA:0:7}"
    - echo "$GITHUB_TOKEN" | docker login -u "$GITHUB_ACTOR" --password-stdin ghcr.io
    - apk add --no-cache curl
    - |
      if [ -z "$MONGODB_URI" ]; then
        echo "MONGODB_URI not set"
        exit 1
      fi
    - |
      if [ ! -f "docker/docker-compose.smoke.yml" ]; then
        echo "Smoke compose file not found"
        exit 1
      fi
    - export GHCR_REPO="ghcr.io/gogidix-road-assist/foundation-domain"
    - export IMAGE_TAG="${SHORT_SHA}"
    - export MONGODB_URI="${MONGODB_URI}"
    - docker compose -f docker/docker-compose.smoke.yml up -d
    - sleep 60
    - |
      SERVICES="service-registry:8761 config-service:8080 api-gateway:8304 tenant-org-service:8085 monitoring-service:8091 dashboard-configuration-service:8200 feature-flags-service:8100 dynamic-routing-config-service:8102 rate-limit-policy-service:8104 release-rollout-config-service:8105 tenancy-configuration-service:8106 dashboard-analytics-service:8201 dashboard-reporting-service:8202 country-aggregation-service:8095 executive-aggregation-service:8096 common-domain-models:8261 country-localization-config-service:8262 user-profile-service:8310 database-indexing-service:8090 access-control-service:8311 alerting-service:8312 api-keys-service:8313 audit-correlation-service:8314 database-management-service:8315 event-audit-service:8316 idempotency-service:8317 identity-access-service:8318 identity-service:8319 integration-adapters-service:8320 logging-aggregation-service:8321 metrics-telemetry-service:8324 mfa-service:8325 rate-limiting-service:8326 request-routing-service:8327 service-health-monitor:8328 service-health-monitor-service:8329 session-token-service:8330 waf-policy-service:8331 event-schemas:8332"
      PASS=0
      FAIL=0
      FAILED_SVCS=""
      REMAINING=""
      for svc_port in $SERVICES; do
        REMAINING="${REMAINING} ${svc_port}"
      done
      MAX_WAIT=480
      ELAPSED=0
      while [ $ELAPSED -lt $MAX_WAIT ] && [ -n "$REMAINING" ]; do
        NEW_REMAINING=""
        for svc_port in $REMAINING; do
          svc=$(echo "$svc_port" | cut -d: -f1)
          PORT=$(echo "$svc_port" | cut -d: -f2)
          HTTP_CODE=$(curl -sf --connect-timeout 2 --max-time 3 -o /dev/null -w '%{http_code}' "http://docker:${PORT}/actuator/health" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "${svc}: HEALTHY after $((ELAPSED + 120))s"
            PASS=$((PASS + 1))
          else
            NEW_REMAINING="${NEW_REMAINING} ${svc_port}"
          fi
        done
        REMAINING="${NEW_REMAINING}"
        if [ -n "$REMAINING" ]; then
          sleep 15
          ELAPSED=$((ELAPSED + 15))
        fi
      done
      for svc_port in $REMAINING; do
        svc=$(echo "$svc_port" | cut -d: -f1)
        PORT=$(echo "$svc_port" | cut -d: -f2)
        FAIL=$((FAIL + 1))
        FAILED_SVCS="${FAILED_SVCS} ${svc}"
        echo "ERROR: ${svc} failed health check on port ${PORT}"
        echo "--- ${svc} container logs ---"
        docker compose -f docker/docker-compose.smoke.yml logs --tail 30 "${svc}" 2>/dev/null || true
        echo "--- end ${svc} logs ---"
      done
      echo "Smoke test: ${PASS} passed, ${FAIL} failed"
      if [ "${FAIL}" -gt 0 ]; then
        exit 1
      fi
    - docker compose -f docker/docker-compose.smoke.yml down -v --remove-orphans 2>/dev/null || true

integration-test:
  stage: integration
  image: maven:3.9-eclipse-temurin-21
  needs: [smoke-test]
  tags: [docker]
  timeout: 1h
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_API_VERSION: "1.43"
    RUNNER_SCRIPT_TIMEOUT: 55m
  before_script:
    - docker system prune -af --volumes 2>/dev/null || true
    - *maven_setup
    - apt-get update -qq && apt-get install -qq -y docker.io curl > /dev/null 2>&1
    - echo "$GITHUB_TOKEN" | docker login -u "$GITHUB_ACTOR" --password-stdin ghcr.io
  script:
    - SHORT_SHA="${CI_COMMIT_SHA:0:7}"
    - |
      if [ -z "$MONGODB_URI" ]; then
        echo "MONGODB_URI not set"
        exit 1
      fi
    - export GHCR_REPO="ghcr.io/gogidix-road-assist/foundation-domain"
    - export IMAGE_TAG="${SHORT_SHA}"
    - export MONGODB_URI="${MONGODB_URI}"
    - docker compose -f docker/docker-compose.smoke.yml up -d
    - sleep 60
    - |
      SERVICES="service-registry:8761 config-service:8080 api-gateway:8304 tenant-org-service:8085 monitoring-service:8091 dashboard-configuration-service:8200 feature-flags-service:8100 dynamic-routing-config-service:8102 rate-limit-policy-service:8104 release-rollout-config-service:8105 tenancy-configuration-service:8106 dashboard-analytics-service:8201 dashboard-reporting-service:8202 country-aggregation-service:8095 executive-aggregation-service:8096 common-domain-models:8261 country-localization-config-service:8262 user-profile-service:8310 database-indexing-service:8090 access-control-service:8311 alerting-service:8312 api-keys-service:8313 audit-correlation-service:8314 database-management-service:8315 event-audit-service:8316 idempotency-service:8317 identity-access-service:8318 identity-service:8319 integration-adapters-service:8320 logging-aggregation-service:8321 metrics-telemetry-service:8324 mfa-service:8325 rate-limiting-service:8326 request-routing-service:8327 service-health-monitor:8328 service-health-monitor-service:8329 session-token-service:8330 waf-policy-service:8331 event-schemas:8332"
      PASS=0
      FAIL=0
      for svc_port in $SERVICES; do
        svc=$(echo "$svc_port" | cut -d: -f1)
        PORT=$(echo "$svc_port" | cut -d: -f2)
        ELAPSED=0
        HEALTHY=false
        while [ $ELAPSED -lt 180 ]; do
          HTTP_CODE=$(curl -sf --connect-timeout 2 --max-time 3 -o /dev/null -w '%{http_code}' "http://docker:${PORT}/actuator/health" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "${svc}: HEALTHY after ${ELAPSED}s"
            HEALTHY=true
            break
          fi
          sleep 5
          ELAPSED=$((ELAPSED + 5))
        done
        if $HEALTHY; then
          PASS=$((PASS + 1))
        else
          FAIL=$((FAIL + 1))
          echo "WARNING: ${svc} not healthy for integration tests (port ${PORT})"
        fi
      done
      echo "Health check: ${PASS} passed, ${FAIL} not ready"
    - |
      mvn install -U -DskipTests -N -q
      cd shared-libraries && mvn clean install -U -DskipTests -q && cd $CI_PROJECT_DIR
    - |
      FAILSAFE_FAIL=0
      for subdomain in central-configuration/Backend/Java shared-infrastructure/Backend/Java orchestration-services/Backend/Java centralized-dashboard/Backend/Java; do
        if [ -f "${subdomain}/pom.xml" ]; then
          echo "Running integration tests for ${subdomain}..."
          mvn failsafe:integration-test failsafe:verify -f "${subdomain}/pom.xml" -DskipUnitTests=true || FAILSAFE_FAIL=$((FAILSAFE_FAIL + 1))
        fi
      done
      for svc in shared-libraries/shared-models/*/; do
        if [ -f "${svc}pom.xml" ]; then
          echo "Running integration tests for $(basename ${svc})..."
          mvn failsafe:integration-test failsafe:verify -f "${svc}pom.xml" -DskipUnitTests=true || FAILSAFE_FAIL=$((FAILSAFE_FAIL + 1))
        fi
      done
      if [ "${FAILSAFE_FAIL}" -gt 0 ]; then
        echo "Integration tests failed in ${FAILSAFE_FAIL} subdomain(s)"
        exit 1
      fi
      echo "All integration tests passed"
    - docker compose -f docker/docker-compose.smoke.yml down -v --remove-orphans 2>/dev/null || true

promote-staging:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: false
  script:
    - apk add --no-cache git
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@gogidix.com"
    - git fetch origin staging/uat || true
    - git checkout -B staging/uat origin/dev
    - git push -f origin staging/uat
  environment:
    name: staging/uat

promote-production:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "staging/uat"
      when: manual
      allow_failure: false
  script:
    - apk add --no-cache git
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@gogidix.com"
    - git fetch origin production || true
    - git checkout -B production origin/staging/uat
    - git push -f origin production
  environment:
    name: production

notify:
  stage: notify
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_failure
      allow_failure: false
  script:
    - |
      if [ -n "$SLACK_WEBHOOK_URL" ]; then
        apk add --no-cache curl
        curl -sf -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-type: application/json' \
          -d "{\"text\":\"Foundation-Domain pipeline FAILED on ${CI_COMMIT_BRANCH} - ${CI_PIPELINE_URL}\"}" || true
      fi
