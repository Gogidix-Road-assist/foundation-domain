stages:
  - publish
  - build
  - quality
  - security
  - docker
  - trivy
  - smoke
  - deploy
  - notify

variables:
  MAVEN_OPTS: "-Xmx1024m"
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io

.maven_setup: &maven_setup
  - mkdir -p ~/.m2
  - |
    cat > ~/.m2/settings.xml << SETTINGS
    <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
      <servers>
        <server>
          <id>gitlab-maven</id>
          <username>gitlab-ci-token</username>
          <password>${CI_JOB_TOKEN}</password>
        </server>
        <server>
          <id>github</id>
          <username>${GITHUB_ACTOR}</username>
          <password>${GITHUB_TOKEN}</password>
        </server>
      </servers>
    </settings>
    SETTINGS

publish-shared-libraries:
  stage: publish
  image: maven:3.9-eclipse-temurin-21
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: false
  script:
    - *maven_setup
    - mvn install -U -DskipTests -N -q
    - cd shared-libraries/Backend/Java
    - mvn clean install -U -DskipTests -q
    - cd $CI_PROJECT_DIR
    - |
      for module in shared-libraries/Backend/Java/shared-audit-library \
                    shared-libraries/Backend/Java/shared-cors-config \
                    shared-libraries/Backend/Java/shared-dto-library \
                    shared-libraries/Backend/Java/shared-exception-library \
                    shared-libraries/Backend/Java/shared-idempotency-library \
                    shared-libraries/Backend/Java/shared-mapper-library \
                    shared-libraries/Backend/Java/shared-observability-library \
                    shared-libraries/Backend/Java/shared-persistence-library \
                    shared-libraries/Backend/Java/shared-request-context-library \
                    shared-libraries/Backend/Java/shared-security-library \
                    shared-libraries/Backend/Java/shared-validation-library; do
        lib_name=$(basename "${module}")
        mvn deploy -DskipTests -f "${module}/pom.xml" \
          -DaltDeploymentRepository=gitlab-maven::https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/maven > deploy.log 2>&1 || true
        DEPLOY_OK=$(grep -c "BUILD SUCCESS" deploy.log || echo "0")
        if [ "$DEPLOY_OK" -eq 0 ]; then
          if grep -q "409" deploy.log; then
            echo "WARNING: ${lib_name} already published (409)"
          else
            echo "ERROR: ${lib_name} deploy FAILED"
            cat deploy.log
            exit 1
          fi
        else
          echo "OK: ${lib_name} deployed"
        fi
      done

central-configuration:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  needs: [publish-shared-libraries]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: false
  script:
    - *maven_setup
    - mvn install -U -DskipTests -N -q
    - cd shared-libraries/Backend/Java && mvn clean install -U -DskipTests -q && cd $CI_PROJECT_DIR
    - cd central-configuration/Backend/Java
    - mvn clean package -DskipTests
    - mvn test org.jacoco:jacoco-maven-plugin:report
  services:
    - name: mongo:7
      alias: mongodb
  variables:
    MONGODB_URI: "mongodb://mongodb:27017/test"

