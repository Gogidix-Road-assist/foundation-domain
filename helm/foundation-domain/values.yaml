global:
  namespace: foundation
  environment: production
  registry: ghcr.io
  org: gogidix-road-assist
  repo: foundation-domain
  imageTag: "latest"
  imagePullPolicy: Always
  springProfiles: "kubernetes,kafka-disabled"
  eurekaUrl: "http://service-registry-discovery:8761/eureka/"
  redisHost: "redis"
  redisPort: "6379"
  redisUsername: "default"
  kafkaBootstrapServers: "kafka:9092"
  javaOpts: "-Xmx256m -Xms64m -XX:+UseG1GC"

secrets:
  mongodbUri: ""
  redisHost: ""
  redisPort: ""
  redisPassword: ""
  redisUsername: ""

ingress:
  enabled: false
  host: foundation.gogidix.com
  className: nginx
  tls:
    enabled: false
    issuer: letsencrypt-prod

services:
  service-registry-discovery:
    port: 8761
    headless: true
    replicas: 1
    resources:
      requests: { memory: "512Mi", cpu: "250m" }
      limits: { memory: "1Gi", cpu: "500m" }
    probes:
      liveness: { initialDelaySeconds: 60, periodSeconds: 20 }
      readiness: { initialDelaySeconds: 30, periodSeconds: 10 }
  api-gateway:
    port: 8304
    expose: true
    replicas: 1
    resources:
      requests: { memory: "512Mi", cpu: "250m" }
      limits: { memory: "1Gi", cpu: "500m" }
    probes:
      liveness: { initialDelaySeconds: 60, periodSeconds: 20 }
      readiness: { initialDelaySeconds: 30, periodSeconds: 10 }
  config-service:
    port: 8080
    replicas: 1
    resources:
      requests: { memory: "256Mi", cpu: "100m" }
      limits: { memory: "512Mi", cpu: "250m" }
  tenant-org-service:
