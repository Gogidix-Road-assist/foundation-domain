apiVersion: v1
kind: Service
metadata:
  name: {{ include "shared-frontend-libraries.fullname" . }}
  namespace: {{ include "shared-frontend-libraries.namespace" . }}
  labels:
    {{- include "shared-frontend-libraries.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "shared-frontend-libraries.selectorLabels" . | nindent 4 }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
