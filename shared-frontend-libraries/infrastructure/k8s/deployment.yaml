apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-frontend-libraries
  namespace: rapid-assist
  labels:
    app: shared-frontend-libraries
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shared-frontend-libraries
  template:
    metadata:
      labels:
        app: shared-frontend-libraries
        version: v1
    spec:
      containers:
      - name: app
        image: ghcr.io/gogidix/shared-frontend-libraries:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 3000
            name: http
            protocol: TCP
        env:
          - name: NODE_ENV
            valueFrom:
              configMapKeyRef:
                name: shared-frontend-libraries-config
                key: NODE_ENV
          - name: PORT
            value: "3000"
          - name: LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: shared-frontend-libraries-config
                key: LOG_LEVEL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 2
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shared-frontend-libraries-hpa
  namespace: rapid-assist
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shared-frontend-libraries
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
