apiVersion: v1
kind: Secret
metadata:
  name: shared-frontend-libraries-secrets
  namespace: rapid-assist
type: Opaque
data:
  # Base64 encoded values
  # Replace with actual secrets
  API_KEY: <base64-encoded-api-key>
  DATABASE_URL: <base64-encoded-database-url>
  SENTRY_AUTH_TOKEN: <base64-encoded-sentry-token>
---
apiVersion: v1
kind: Secret
metadata:
  name: shared-frontend-libraries-tls
  namespace: rapid-assist
type: kubernetes.io/tls
data:
  # TLS certificate (create with cert-manager)
  tls.crt: <base64-encoded-certificate>
  tls.key: <base64-encoded-private-key>
