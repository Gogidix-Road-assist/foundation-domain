server:
  port: 0

gogidix:
  security:
    supabase:
      issuer-uri: ${GOGIDIX_SUPABASE_ISSUER_URI:}
      audience: ${GOGIDIX_SUPABASE_AUDIENCE:}
  payment:
    persistence:
      type: ${GOGIDIX_PAYMENT_PERSISTENCE:mongodb} # mongodb or memory
    cache:
      ttl-seconds: ${GOGIDIX_PAYMENT_CACHE_TTL:1800} # 30 minutes default
    stripe:
      enabled: ${GOGIDIX_PAYMENT_STRIPE_ENABLED:true}
      secret-key: ${GOGIDIX_STRIPE_SECRET_KEY:}
      publishable-key: ${GOGIDIX_STRIPE_PUBLISHABLE_KEY:}
      webhook-secret: ${GOGIDIX_STRIPE_WEBHOOK_SECRET:}
    default-currency: ${GOGIDIX_PAYMENT_DEFAULT_CURRENCY:USD}
    intent-expiry-seconds: ${GOGIDIX_PAYMENT_INTENT_EXPIRY:1800} # 30 minutes
    max-refund-days: ${GOGIDIX_PAYMENT_MAX_REFUND_DAYS:365}

spring:
  data:
    mongodb:
      host: ${GOGIDIX_MONGODB_HOST:localhost}
      port: ${GOGIDIX_MONGODB_PORT:27017}
      database: ${GOGIDIX_MONGODB_DATABASE:rapidassist_payment}
      username: ${GOGIDIX_MONGODB_USERNAME:}
      password: ${GOGIDIX_MONGODB_PASSWORD:}
      uri: ${GOGIDIX_MONGODB_URI:}

  redis:
    host: ${GOGIDIX_REDIS_HOST:localhost}
    port: ${GOGIDIX_REDIS_PORT:6379}
    password: ${GOGIDIX_REDIS_PASSWORD:}
    timeout: ${GOGIDIX_REDIS_TIMEOUT:2000}
    lettuce:
      pool:
        max-active: ${GOGIDIX_REDIS_POOL_MAX_ACTIVE:8}
        max-idle: ${GOGIDIX_REDIS_POOL_MAX_IDLE:8}
        min-idle: ${GOGIDIX_REDIS_POOL_MIN_IDLE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized