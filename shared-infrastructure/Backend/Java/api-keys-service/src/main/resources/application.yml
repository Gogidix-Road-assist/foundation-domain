server:
  port: 8313

gogidix:
  api-keys:
    provider:
      type: ${GOGIDIX_API_KEYS_PROVIDER:mongo} # mongo or noop
    default-expiry-days: ${GOGIDIX_API_KEYS_EXPIRY_DAYS:365}
    max-usage-per-key: ${GOGIDIX_API_KEYS_MAX_USAGE:0} # 0 for unlimited
    security:
      key-length: ${GOGIDIX_API_KEYS_KEY_LENGTH:32}
      key-prefix: ${GOGIDIX_API_KEYS_KEY_PREFIX:gogidix_}
      hash-keys: ${GOGIDIX_API_KEYS_HASH_KEYS:true}
      hash-algorithm: ${GOGIDIX_API_KEYS_HASH_ALG:SHA-256}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:api_keys_service}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USERNAME:}
      database: 17
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
      database: ${GOGIDIX_API_KEYS_DB:api_keys}

management:
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized