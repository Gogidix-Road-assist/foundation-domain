server:
  port: 0

gogidix:
  security:
    supabase:
      issuer-uri: ${GOGIDIX_SUPABASE_ISSUER_URI:}
      audience: ${GOGIDIX_SUPABASE_AUDIENCE:}
  access-control:
    policy-engine:
      type: ${GOGIDIX_ACCESS_CONTROL_ENGINE:rbac} # rbac or noop
    cache:
      enabled: ${GOGIDIX_ACCESS_CONTROL_CACHE_ENABLED:true}
      size: ${GOGIDIX_ACCESS_CONTROL_CACHE_SIZE:10000}
      ttlMs: ${GOGIDIX_ACCESS_CONTROL_CACHE_TTL:5000}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${GOGIDIX_ACCESS_CONTROL_DB:access_control}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
