server:
  port: 8326

gogidix:
  rate-limiting:
    provider:
      type: ${GOGIDIX_RATE_LIMITING_PROVIDER:comprehensive} # comprehensive or noop
    key-prefix: ${GOGIDIX_RATE_LIMITING_KEY_PREFIX:rapidassist}
    default-limit: ${GOGIDIX_RATE_LIMITING_DEFAULT_LIMIT:100}
    default-window-size-ms: ${GOGIDIX_RATE_LIMITING_WINDOW:60000}
    algorithm:
      type: ${GOGIDIX_RATE_LIMITING_ALGORITHM:sliding_window} # fixed_window, sliding_window, token_bucket
      limit: ${GOGIDIX_RATE_LIMITING_ALG_LIMIT:100}
      window-size-ms: ${GOGIDIX_RATE_LIMITING_ALG_WINDOW:60000}
      capacity: ${GOGIDIX_RATE_LIMITING_CAPACITY:100}
      refill-rate: ${GOGIDIX_RATE_LIMITING_REFILL_RATE:10}
      refill-interval-ms: ${GOGIDIX_RATE_LIMITING_REFILL_INTERVAL:1000}
    mongo-enabled: ${GOGIDIX_RATE_LIMITING_MONGO_ENABLED:false}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${GOGIDIX_RATE_LIMITING_DB:rate_limiting}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
