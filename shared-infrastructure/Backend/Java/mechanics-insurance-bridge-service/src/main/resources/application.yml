server:
  port: 8096

spring:
  application:
    name: mechanics-insurance-bridge-service

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Cross-Domain Service URLs
services:
  insurance:
    base-url: http://localhost:8083
    claims-service: http://localhost:8092
    policy-service: http://localhost:8083

  mechanics:
    base-url: http://localhost:8089
    workshop-booking: http://localhost:8089
    mobile-mechanic: http://localhost:8088

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      insuranceService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
      mechanicsService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000

  retry:
    instances:
      insuranceService:
        max-attempts: 3
        wait-duration: 1000
      mechanicsService:
        max-attempts: 3
        wait-duration: 1000

# Logging
logging:
  level:
    com.gogidix.rapidassist: DEBUG
    org.springframework.web.reactive: DEBUG
