server:
  port: 8317

gogidix:
  idempotency:
    persistence:
      type: ${GOGIDIX_IDEMPOTENCY_PERSISTENCE:redis} # redis or memory
    default-ttl-seconds: ${GOGIDIX_IDEMPOTENCY_TTL:3600} # 1 hour default
    max-retries: ${GOGIDIX_IDEMPOTENCY_MAX_RETRIES:3}
    lock-timeout-seconds: ${GOGIDIX_IDEMPOTENCY_LOCK_TIMEOUT:300} # 5 minutes

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:idempotency_service}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USERNAME:}
      database: 22
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
management:
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized