server:
  port: 8317

gogidix:
  idempotency:
    persistence:
      type: ${GOGIDIX_IDEMPOTENCY_PERSISTENCE:redis} # redis or memory
    default-ttl-seconds: ${GOGIDIX_IDEMPOTENCY_TTL:3600} # 1 hour default
    max-retries: ${GOGIDIX_IDEMPOTENCY_MAX_RETRIES:3}
    lock-timeout-seconds: ${GOGIDIX_IDEMPOTENCY_LOCK_TIMEOUT:300} # 5 minutes

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
