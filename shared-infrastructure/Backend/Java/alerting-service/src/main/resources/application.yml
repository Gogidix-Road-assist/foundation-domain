server:
  port: 8312

gogidix:
  alerting:
    rules-retention: ${GOGIDIX_ALERTING_RULES_RETENTION:365d}
    events-retention: ${GOGIDIX_ALERTING_EVENTS_RETENTION:90d}
    mongo-enabled: ${GOGIDIX_ALERTING_MONGO_ENABLED:false}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
