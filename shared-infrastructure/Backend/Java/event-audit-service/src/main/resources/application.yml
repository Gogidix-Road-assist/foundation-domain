server:
  port: 8316

gogidix:
  security:
    supabase:
      issuer-uri: ${GOGIDIX_SUPABASE_ISSUER_URI:}
      audience: ${GOGIDIX_SUPABASE_AUDIENCE:}
  audit:
    retention: ${GOGIDIX_AUDIT_RETENTION:90d}
    mongo-enabled: ${GOGIDIX_AUDIT_MONGO_ENABLED:false}

spring:
  data:
    mongodb:
      uri: ${GOGIDIX_AUDIT_MONGO_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
