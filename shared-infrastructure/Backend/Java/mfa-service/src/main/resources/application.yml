server:
  port: 8325

gogidix:
  mfa:
    provider:
      type: ${GOGIDIX_MFA_PROVIDER:comprehensive} # comprehensive or noop
    totp:
      issuer: ${GOGIDIX_MFA_ISSUER:Gogidix RapidAssist}
      time-step-seconds: ${GOGIDIX_MFA_TOTP_TIMESTEP:30}
      code-digits: ${GOGIDIX_MFA_CODE_DIGITS:6}
      algorithm: ${GOGIDIX_MFA_ALGORITHM:HmacSHA1}
    otp:
      length: ${GOGIDIX_MFA_OTP_LENGTH:6}
      expiration-seconds: ${GOGIDIX_MFA_OTP_EXPIRY:300}
      max-attempts: ${GOGIDIX_MFA_MAX_ATTEMPTS:3}
      sms-template: "${GOGIDIX_MFA_SMS_TEMPLATE:Your verification code is: {code}}"
      email-template: "${GOGIDIX_MFA_EMAIL_TEMPLATE:Your verification code is: {code}}"
    backup-codes:
      count: ${GOGIDIX_MFA_BACKUP_COUNT:10}
      code-length: ${GOGIDIX_MFA_BACKUP_LENGTH:8}
      alphanumeric: ${GOGIDIX_MFA_BACKUP_ALPHANUMERIC:true}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:mfa_service}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USERNAME:}
      database: 28
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
      database: ${GOGIDIX_MFA_DB:mfa}

management:
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized