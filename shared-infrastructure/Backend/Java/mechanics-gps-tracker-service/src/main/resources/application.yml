server:
  port: ${SERVER_PORT:8098}
  servlet:
    context-path: /gps-tracker-service
  compression:
    enabled: true

spring:
  application:
    name: mechanics-gps-tracker-service

  datasource:
    url: jdbc:postgresql://localhost:5432/gogidix_mechanics
    username: gogidix_user
    password: ${DB_PASSWORD:change_me_in_production}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # SpringDoc OpenAPI Configuration
  springdoc:
    api-docs:
      enabled: true
      path: /api-docs
    swagger-ui:
      enabled: true
      path: /swagger-ui.html
      show-actuator: true
    packages-to-scan: com.gogidix.rapidassist.crossdomain.gps
    paths-to-match: /api/**

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    enabled: true
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Cross-Domain Service URLs
services:
  mechanics:
    mobile-mechanic-service: ${MOBILE_MECHANIC_SERVICE_URL:http://localhost:8088}
    staff-management-service: ${STAFF_MANAGEMENT_SERVICE_URL:http://localhost:8085}

  central-monitoring:
    base-url: ${CENTRAL_MONITORING_URL:http://localhost:9020}
    tracking-api: ${CENTRAL_MONITORING_URL:http://localhost:9020}/tracking-service/api/tracking
    monitoring-api: ${CENTRAL_MONITORING_URL:http://localhost:9020}/monitoring-service/api/monitoring

# GPS Tracking Configuration
gps-tracking:
  update-interval: ${GPS_UPDATE_INTERVAL:30000} # 30 seconds
  batch-size: ${GPS_BATCH_SIZE:100}
  max-history-days: ${GPS_MAX_HISTORY_DAYS:30}
  geofence-radius-meters: ${GPS_GEOFENCE_RADIUS:500}
  nearby-search-radius-km: ${GPS_NEARBY_RADIUS:10}
  location-expiry-minutes: ${GPS_LOCATION_EXPIRY:5}

# WebSocket Configuration
websocket:
  enabled: ${WEBSOCKET_ENABLED:true}
  endpoint: /ws/gps-tracker

# Logging
logging:
  level:
    root: INFO
    com.gogidix.rapidassist.crossdomain.gps: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
