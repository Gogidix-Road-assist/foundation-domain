server:
  port: 0

gogidix:
  security:
    supabase:
      issuer-uri: ${GOGIDIX_SUPABASE_ISSUER_URI:}
      audience: ${GOGIDIX_SUPABASE_AUDIENCE:}
  policy-engine:
    provider:
      type: ${GOGIDIX_POLICY_ENGINE_PROVIDER:comprehensive} # comprehensive or noop
    cache:
      enabled: ${GOGIDIX_POLICY_ENGINE_CACHE_ENABLED:true}
      max-size: ${GOGIDIX_POLICY_ENGINE_CACHE_SIZE:1000}
      ttl-seconds: ${GOGIDIX_POLICY_ENGINE_CACHE_TTL:300}
    evaluation:
      max-depth: ${GOGIDIX_POLICY_ENGINE_MAX_DEPTH:10}
      max-time-ms: ${GOGIDIX_POLICY_ENGINE_MAX_TIME:5000}
      enable-metrics: ${GOGIDIX_POLICY_ENGINE_METRICS:true}
      enable-tracing: ${GOGIDIX_POLICY_ENGINE_TRACING:true}

spring:
  data:
    mongodb:
      uri: ${GOGIDIX_MONGODB_URI:mongodb://localhost:27017/rapidassist}
      database: ${GOGIDIX_POLICY_ENGINE_DB:policy_engine}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
