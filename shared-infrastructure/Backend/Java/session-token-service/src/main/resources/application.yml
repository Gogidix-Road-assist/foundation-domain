server:
  port: 8330

gogidix:
  session-token:
    provider:
      type: ${GOGIDIX_SESSION_TOKEN_PROVIDER:jwt} # jwt or noop
    key-prefix: ${GOGIDIX_SESSION_TOKEN_KEY_PREFIX:rapidassist:session}
    enable-refresh-tokens: ${GOGIDIX_SESSION_TOKEN_ENABLE_REFRESH:true}
    jwt:
      secret: ${GOGIDIX_JWT_SECRET:}
      algorithm: ${GOGIDIX_JWT_ALGORITHM:HS256}
      issuer: ${GOGIDIX_JWT_ISSUER:Gogidix RapidAssist}
      access-token-ttl-seconds: ${GOGIDIX_ACCESS_TOKEN_TTL:3600}
      refresh-token-ttl-seconds: ${GOGIDIX_REFRESH_TOKEN_TTL:2592000}
      default-scopes: ${GOGIDIX_DEFAULT_SCOPES:read write}
      default-roles: ${GOGIDIX_DEFAULT_ROLES:USER}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:session_token_service}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USERNAME:}
      database: 33
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
management:
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized