server:
  port: 8329

gogidix:
  service-health:
    retention: ${GOGIDIX_SERVICE_HEALTH_RETENTION:30d}
    mongo-enabled: ${GOGIDIX_SERVICE_HEALTH_MONGO_ENABLED:false}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
