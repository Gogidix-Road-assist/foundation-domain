server:
  port: 8324

gogidix:
  security:
    supabase:
      issuer-uri: ${GOGIDIX_SUPABASE_ISSUER_URI:}
      audience: ${GOGIDIX_SUPABASE_AUDIENCE:}
  telemetry:
    retention: ${GOGIDIX_TELEMETRY_RETENTION:30d}
    mongo-enabled: ${GOGIDIX_TELEMETRY_MONGO_ENABLED:false}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
