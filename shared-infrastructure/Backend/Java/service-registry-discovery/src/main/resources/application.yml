server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: service-registry-discovery

  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:rapid_assist_service_registry}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      # Redis is optional - for caching only
      condition-on-property: "spring.redis.host"

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    mongo:
      enabled: true
    redis:
      enabled: false  # Optional - don't fail health check if unavailable

logging:
  level:
    com.gogidix.rapidassist.service.registry.discovery: INFO
    org.springframework.data.mongodb: WARN
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
    org.springframework.data.redis: WARN  # Only log Redis issues, not debug
