      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.gogidix.rapidassist.service.registry.discovery: DEBUG
    org.springframework.data.mongodb: DEBUG
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
