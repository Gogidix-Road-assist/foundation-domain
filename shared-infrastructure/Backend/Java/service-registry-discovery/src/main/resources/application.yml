server:
  port: ${SERVER_PORT:8761}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  cloud:
    compatibility-verifier:
      enabled: false
  application:
    name: service-registry-discovery

  data:
    mongodb:
      uri: ${MONGODB_URI:}
      auto-index-creation: true
      database: ${MONGODB_DATABASE:rapid_assist_service_registry}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USERNAME:}
      database: 12
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 30000

management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    mongo:
      enabled: true
logging:
  level:
    com.gogidix.rapidassist.service.registry.discovery: INFO
    org.springframework.data.mongodb: WARN
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
    org.springframework.data.redis: WARN  # Only log Redis issues, not debug