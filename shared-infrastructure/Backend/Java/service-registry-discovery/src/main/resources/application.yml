server:
  port: ${SERVER_PORT:8761}

gogidix:
  security:
    supabase:
      issuer-uri: ${GOGIDIX_SUPABASE_ISSUER_URI:}
      audience: ${GOGIDIX_SUPABASE_AUDIENCE:}

spring:
  application:
    name: service-registry-discovery

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://gazalgidix_db_user:Ajimmy2907@cluster0.ggksiwg.mongodb.net/rapid_assist_service_registry?appName=Cluster0}
      database: ${MONGODB_DATABASE:rapid_assist_service_registry}
    redis:
      host: ${REDIS_HOST:r-4xo326106227c264.redis.germany.rds.aliyuncs.com}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Gog1d1xPlatform2026}
      timeout: 2000ms
