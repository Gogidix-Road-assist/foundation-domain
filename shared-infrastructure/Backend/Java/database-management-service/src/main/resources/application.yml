spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  application:
    name: database-management-service
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:database_management_service}
      auto-index-creation: true
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USERNAME:}
      database: 20
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
      database: ${GOGIDIX_DB_MANAGEMENT_DB:database_management}
server:
  port: 8315

# Database Management Configuration
database:
  management:
    pool:
      default-size: 10
      max-size: 50
      min-idle: 2
      max-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    health:
      interval: 60000
      timeout: 5000
      retry-attempts: 3
    backup:
      storage-location: /tmp/db-backups
      max-concurrent-backups: 3
      compression: true
      encryption: false
    migration:
      auto-migrate: false
      validate-on-startup: true
      locations: classpath:db/migration

# Logging
logging:
  level:
    com.gogidix.rapidassist.database: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator endpoints
management:
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,metrics
  endpoint:
    health:
      show-details: always