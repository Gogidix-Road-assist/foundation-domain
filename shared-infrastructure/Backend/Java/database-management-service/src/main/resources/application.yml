spring:
  application:
    name: database-management-service
  redis:
    host: localhost
    port: 6379
    timeout: 3000

server:
  port: 0

# Database Management Configuration
database:
  management:
    pool:
      default-size: 10
      max-size: 50
      min-idle: 2
      max-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    health:
      interval: 60000
      timeout: 5000
      retry-attempts: 3
    backup:
      storage-location: /tmp/db-backups
      max-concurrent-backups: 3
      compression: true
      encryption: false
    migration:
      auto-migrate: false
      validate-on-startup: true
      locations: classpath:db/migration

# Logging
logging:
  level:
    com.gogidix.rapidassist.database: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

gogidix:
  security:
    supabase:
      issuer-uri: ${GOGIDIX_SUPABASE_ISSUER_URI:}
      audience: ${GOGIDIX_SUPABASE_AUDIENCE:}
