server:
  port: ${SERVER_PORT:8304}
  shutdown: graceful

gogidix:
  gateway:
    correlation-id-header: ${GOGIDIX_CORRELATION_ID_HEADER:X-Correlation-Id}
  security:
    supabase:
      issuer-uri: ${GOGIDIX_SUPABASE_ISSUER_URI:}
      audience: ${GOGIDIX_SUPABASE_AUDIENCE:}

spring:
  application:
    name: edge-api-gateway

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://gazalgidix_db_user:Ajimmy2907@cluster0.ggksiwg.mongodb.net/rapid_assist_gateway?appName=Cluster0}
      database: ${MONGODB_DATABASE:rapid_assist_gateway}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cloud:
    gateway:
      routes:
        # ========================================
        # Domain Gateway Routes (Edge → Domain GW)
        # ========================================

        - id: business-domain
          uri: ${BUSINESS_DOMAIN_GATEWAY_URL:http://localhost:8060}
          predicates:
            - Path=/api/monitoring/**,/api/vendor/**,/api/towing/**,/api/mechanics/**,/api/onboarding/**,/api/users/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: businessDomainCB
                fallbackUri: forward:/api/gateway/fallback

        - id: shared-business-core
          uri: ${SHARED_BUSINESS_CORE_GATEWAY_URL:http://localhost:8305}
          predicates:
            - Path=/api/dispatch/**,/api/fleet/**,/api/billing/**,/api/pricing/**,/api/policy-engine/**,/api/risk-assessment/**,/api/analytics/**,/api/adapters/**,/api/workflow/**,/api/ai/**,/api/reporting/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: sharedBusinessCoreCB
                fallbackUri: forward:/api/gateway/fallback

        - id: claim-orchestrator
          uri: ${CLAIM_ORCHESTRATOR_GATEWAY_URL:http://localhost:8700}
          predicates:
            - Path=/api/claims/**,/api/incidents/**,/api/insurance-cases/**,/api/settlements/**,/api/v1/claims/**,/api/v1/incidents/**,/api/v1/insurance-cases/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: claimOrchestratorCB
                fallbackUri: forward:/api/gateway/fallback

        - id: management-domain
          uri: ${MANAGEMENT_DOMAIN_GATEWAY_URL:http://localhost:8100}
          predicates:
            - Path=/api/management/**,/api/cms/**,/api/hr/**,/api/finance/**,/api/sales/**,/api/pricing-policy/**,/api/compliance/**,/api/marketing/**,/api/country-admin/**,/api/customer-support/**,/api/executive/**,/api/global-admin/**,/api/pages/**,/api/blog/**,/api/media/**,/api/forms/**,/api/team/**,/api/testimonials/**,/api/careers/**,/api/products/**,/api/auth/**,/api/public/**,/api/insurance-content/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: managementDomainCB
                fallbackUri: forward:/api/gateway/fallback

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3019,http://localhost:3020}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-Correlation-Id
              - Authorization
            allowCredentials: true
            maxAge: 3600

      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        timeout-duration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    com.gogidix.rapidassist.api.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
