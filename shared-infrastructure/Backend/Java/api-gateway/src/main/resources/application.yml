server:
  port: ${SERVER_PORT:8304}
  shutdown: graceful

gogidix:
  gateway:
    correlation-id-header: ${GOGIDIX_CORRELATION_ID_HEADER:X-Correlation-Id}
spring:
  main:
    web-application-type: reactive
  application:
    name: edge-api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

  # Redis is OPTIONAL - only used for rate limiting and caching
  # Gateway will start without Redis if not configured
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:}
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
    # Conditionally load Redis only if host is provided
    condition-on-property: "spring.redis.host"

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # ========================================
        # Domain Gateway Routes (Edge → Domain GW)
        # ========================================

        - id: business-domain
          uri: ${BUSINESS_DOMAIN_GATEWAY_URL:http://localhost:8060}
          predicates:
            - Path=/api/monitoring/**,/api/vendor/**,/api/towing/**,/api/mechanics/**,/api/onboarding/**,/api/users/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: businessDomainCB
                fallbackUri: forward:/api/gateway/fallback

        - id: shared-business-core
          uri: ${SHARED_BUSINESS_CORE_GATEWAY_URL:http://localhost:8305}
          predicates:
            - Path=/api/dispatch/**,/api/fleet/**,/api/billing/**,/api/pricing/**,/api/policy-engine/**,/api/risk-assessment/**,/api/analytics/**,/api/adapters/**,/api/workflow/**,/api/ai/**,/api/reporting/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: sharedBusinessCoreCB
                fallbackUri: forward:/api/gateway/fallback

        - id: claim-orchestrator
          uri: ${CLAIM_ORCHESTRATOR_GATEWAY_URL:http://localhost:8700}
          predicates:
            - Path=/api/claims/**,/api/incidents/**,/api/insurance-cases/**,/api/settlements/**,/api/v1/claims/**,/api/v1/incidents/**,/api/v1/insurance-cases/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: claimOrchestratorCB
                fallbackUri: forward:/api/gateway/fallback

        - id: management-domain
          uri: ${MANAGEMENT_DOMAIN_GATEWAY_URL:http://localhost:8100}
          predicates:
            - Path=/api/management/**,/api/cms/**,/api/hr/**,/api/finance/**,/api/sales/**,/api/pricing-policy/**,/api/compliance/**,/api/marketing/**,/api/country-admin/**,/api/customer-support/**,/api/executive/**,/api/global-admin/**,/api/pages/**,/api/blog/**,/api/media/**,/api/forms/**,/api/team/**,/api/testimonials/**,/api/careers/**,/api/products/**,/api/auth/**,/api/public/**,/api/insurance-content/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: managementDomainCB
                fallbackUri: forward:/api/gateway/fallback

        # ========================================
        # Aggregation Services (Layer 3 → Layer 2)
        # ========================================

        - id: country-aggregation
          uri: ${COUNTRY_AGGREGATION_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/country-aggregation/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: countryAggregationCB
                fallbackUri: forward:/api/gateway/fallback

        - id: executive-aggregation
          uri: ${EXECUTIVE_AGGREGATION_URL:http://localhost:8096}
          predicates:
            - Path=/api/v1/executive-aggregation/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: executiveAggregationCB
                fallbackUri: forward:/api/gateway/fallback

        # ========================================
        # Intelligence Domain Routes
        # ========================================

        - id: incident-orchestration-domain
          uri: ${INCIDENT_ORCHESTRATION_GW_URL:http://localhost:8400}
          predicates:
            - Path=/api/incidents/orchestration/**,/api/v1/incident-orchestration/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: incidentOrchestrationCB
                fallbackUri: forward:/api/gateway/fallback

        - id: emergency-dispatch-domain
          uri: ${EMERGENCY_DISPATCH_GW_URL:http://localhost:8450}
          predicates:
            - Path=/api/emergency/**,/api/v1/emergency-dispatch/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: emergencyDispatchCB
                fallbackUri: forward:/api/gateway/fallback

        - id: government-integration-domain
          uri: ${GOVERNMENT_INTEGRATION_GW_URL:http://localhost:8500}
          predicates:
            - Path=/api/government/**,/api/v1/government-integration/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: governmentIntegrationCB
                fallbackUri: forward:/api/gateway/fallback

        - id: national-compliance-domain
          uri: ${NATIONAL_COMPLIANCE_GW_URL:http://localhost:8550}
          predicates:
            - Path=/api/compliance/gdpr/**,/api/compliance/iso27001/**,/api/v1/national-compliance/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: nationalComplianceCB
                fallbackUri: forward:/api/gateway/fallback

        - id: incident-ai-intelligence-domain
          uri: ${INCIDENT_AI_GW_URL:http://localhost:8650}
          predicates:
            - Path=/api/ai/prediction/**,/api/ai/ml/**,/api/v1/incident-ai/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: incidentAiCB
                fallbackUri: forward:/api/gateway/fallback

        - id: public-safety-intelligence-domain
          uri: ${PUBLIC_SAFETY_GW_URL:http://localhost:8600}
          predicates:
            - Path=/api/public-safety/**,/api/v1/public-safety/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: publicSafetyCB
                fallbackUri: forward:/api/gateway/fallback

        - id: cross-border-coordination-domain
          uri: ${CROSS_BORDER_GW_URL:http://localhost:8350}
          predicates:
            - Path=/api/cross-border/**,/api/v1/cross-border-coordination/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: crossBorderCB
                fallbackUri: forward:/api/gateway/fallback

        - id: simulation-sandbox-domain
          uri: ${SIMULATION_SANDBOX_GW_URL:http://localhost:8800}
          predicates:
            - Path=/api/simulation/**,/api/v1/simulation-sandbox/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: simulationSandboxCB
                fallbackUri: forward:/api/gateway/fallback

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3019,http://localhost:3020}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-Correlation-Id
              - Authorization
            allowCredentials: true
            maxAge: 3600

      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        timeout-duration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      enabled: true
    # API Gateway is stateless - no database health check
    mongo:
      enabled: false
    # Redis is optional - only for rate limiting
    redis:
      enabled: false
    diskSpace:
      enabled: true

logging:
  level:
    com.gogidix.rapidassist.api.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.data.redis: WARN
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
