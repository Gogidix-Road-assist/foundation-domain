name: Foundation-Domain CI/CD

on:
  push:
    branches: [main, dev, staging/uat, production, hotfix]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run unit tests'
        required: true
        default: true
        type: boolean
      run_security_scan:
        description: 'Run security scans (Snyk, TruffleHog)'
        required: true
        default: true
        type: boolean
      run_code_quality:
        description: 'Run code quality checks (Semgrep)'
        required: true
        default: true
        type: boolean
      deploy_env:
        description: 'Deploy to environment'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - staging
          - production

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish-shared-libraries:
    name: "📦 Publish Shared Libraries"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build all shared libraries
        working-directory: shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -q

      - name: Deploy root reactor POM
        run: |
          mvn deploy -DskipTests -N -DaltDeploymentRepository=github::https://maven.pkg.github.com/Gogidix-Road-assist/foundation-domain 2>&1 | tee deploy.log || {
            if grep -q "409" deploy.log; then
              echo "::warning::Version already published (409). Skipping."
            else
              echo "::warning::Deploy failed. Continuing."
            fi
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy all shared libraries
        run: |
          for module in shared-libraries/Backend/Java/shared-audit-library \
                        shared-libraries/Backend/Java/shared-cors-config \
                        shared-libraries/Backend/Java/shared-dto-library \
                        shared-libraries/Backend/Java/shared-exception-library \
                        shared-libraries/Backend/Java/shared-idempotency-library \
                        shared-libraries/Backend/Java/shared-mapper-library \
                        shared-libraries/Backend/Java/shared-observability-library \
                        shared-libraries/Backend/Java/shared-persistence-library \
                        shared-libraries/Backend/Java/shared-request-context-library \
                        shared-libraries/Backend/Java/shared-security-library \
                        shared-libraries/Backend/Java/shared-validation-library; do
            mvn deploy -DskipTests -f "${module}/pom.xml" \
              -DaltDeploymentRepository=github::https://maven.pkg.github.com/Gogidix-Road-assist/foundation-domain 2>&1 | tee deploy.log || {
              if grep -q "409" deploy.log; then
                echo "::warning::Version already published (409). Skipping ${module}."
              else
                echo "::warning::Deploy failed for ${module}. Continuing."
              fi
            }
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  central-configuration:
    name: "⚙️ Central-Configuration (Build → Test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build with dependencies
        run: mvn clean install -Dmaven.test.skip=true -pl central-configuration/Backend/Java -am

      - name: Run Tests
        if: inputs.run_tests != false
        run: mvn test org.jacoco:jacoco-maven-plugin:report -pl central-configuration/Backend/Java

      - name: Package
        run: mvn package -DskipTests -pl central-configuration/Backend/Java

      - name: Upload Coverage
        if: inputs.run_tests != false
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: central-configuration/**/target/site/jacoco/jacoco.xml
          flags: central-configuration
          fail_ci_if_error: false

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: central-configuration-jars
          path: central-configuration/Backend/Java/**/target/*.jar
          retention-days: 1

  shared-infrastructure:
    name: "🏗️ Shared-Infrastructure (Build → Test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build with dependencies
        run: mvn clean install -Dmaven.test.skip=true -pl shared-infrastructure/Backend/Java -am

      - name: Run Tests
        if: inputs.run_tests != false
        run: mvn test org.jacoco:jacoco-maven-plugin:report -pl shared-infrastructure/Backend/Java

      - name: Package
        run: mvn package -DskipTests -pl shared-infrastructure/Backend/Java

      - name: Upload Coverage
        if: inputs.run_tests != false
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: shared-infrastructure/**/target/site/jacoco/jacoco.xml
          flags: shared-infrastructure
          fail_ci_if_error: false

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-infrastructure-jars
          path: shared-infrastructure/Backend/Java/**/target/*.jar
          retention-days: 1

  orchestration-services:
    name: "🎯 Orchestration-Services (Build → Test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build with dependencies
        run: mvn clean install -Dmaven.test.skip=true -pl orchestration-services/Backend/Java -am

      - name: Run Tests
        if: inputs.run_tests != false
        run: mvn test org.jacoco:jacoco-maven-plugin:report -pl orchestration-services/Backend/Java

      - name: Package
        run: mvn package -DskipTests -pl orchestration-services/Backend/Java

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-services-jars
          path: orchestration-services/Backend/Java/**/target/*.jar
          retention-days: 1

  centralized-dashboard:
    name: "📊 Centralized-Dashboard (Build → Test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build with dependencies
        run: mvn clean install -Dmaven.test.skip=true -pl centralized-dashboard/Backend/Java -am

      - name: Run Tests
        if: inputs.run_tests != false
        run: mvn test org.jacoco:jacoco-maven-plugin:report -pl centralized-dashboard/Backend/Java

      - name: Package
        run: mvn package -DskipTests -pl centralized-dashboard/Backend/Java

      - name: Upload Coverage
        if: inputs.run_tests != false
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: centralized-dashboard/**/target/site/jacoco/jacoco.xml
          flags: centralized-dashboard
          fail_ci_if_error: false

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: centralized-dashboard-jars
          path: centralized-dashboard/Backend/Java/**/target/*.jar
          retention-days: 1

  code-quality:
    name: "📊 Code Quality Gate (Semgrep)"
    needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard]
    if: |
      (inputs.run_code_quality == true || inputs.run_code_quality == 'true' || inputs.run_code_quality == '') &&
      needs.central-configuration.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  security-scan:
    name: "🔒 Security Gate"
    needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard]
    if: |
      (inputs.run_security_scan == true || inputs.run_security_scan == 'true' || inputs.run_security_scan == '') &&
      needs.central-configuration.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Run Snyk
        if: vars.SNYK_ENABLED != 'false'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          npm install -g snyk snyk-to-html
          snyk test --severity-threshold=high --fail-on=all || true

      - name: Secret Scan
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          extra_args: --only-verified

  docker-build:
    name: "🐳 Docker Build & Scan"
    needs: [code-quality, security-scan]
    if: |
      always() &&
      needs.code-quality.result != 'failed' &&
      needs.security-scan.result != 'failed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find services with Dockerfiles
        id: find-services
        run: |
          SERVICES=$(find . -maxdepth 5 -name "Dockerfile" -exec dirname {} \; | sed 's|^\./||' | sort)
          echo "services<<EOF" >> $GITHUB_OUTPUT
          echo "$SERVICES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$(echo "$SERVICES" | wc -l)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          echo "Building Docker images for ${{ steps.find-services.outputs.count }} services"
          while IFS= read -r service; do
            if [ -z "$service" ]; then continue; fi
            IMAGE_NAME=$(echo "$service" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            IMAGE_TAG="${{ env.REGISTRY }}/gogidix-road-assist/${IMAGE_NAME}:${{ github.sha }}"
            echo "::group::Building $service"
            docker buildx build --load -t "$IMAGE_TAG" "$service" || echo "::warning::Docker build failed for $service"
            echo "::endgroup::"
          done <<< "${{ steps.find-services.outputs.services }}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  deploy-staging:
    name: "🚀 Deploy Staging (Alibaba Cloud ECS)"
    needs: docker-build
    if: |
      (inputs.deploy_env == 'staging' || github.ref == 'refs/heads/dev') &&
      needs.docker-build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://8.220.73.6:8333/actuator/health
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all JAR artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-jars
          merge-multiple: true

      - name: List built artifacts
        run: find all-jars -name "*.jar" ! -name "*.original" | head -30

      - name: Install Alibaba Cloud CLI
        run: |
          curl -o aliyun-cli.tgz https://aliyun-cli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli.tgz
          chmod +x aliyun
          sudo mv aliyun /usr/local/bin/
          aliyun configure set --profile staging --mode AK --access-key-id ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }} --access-key-secret ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }} --region ${{ vars.ALIBABA_CLOUD_REGION || 'eu-central-1' }}

      - name: Upload JARs to OSS
        run: |
          find all-jars -name "*.jar" ! -name "*.original" | while read jar; do
            filename=$(basename "$jar")
            echo "Uploading $filename to OSS..."
            aliyun oss cp "$jar" "oss://${{ vars.ALIBABA_CLOUD_OSS_BUCKET || 'gogidix-platform-assets' }}/deploy/$filename" --force
          done

      - name: Deploy to ECS via RunCommand
        env:
          ALIBABA_AK: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_SK: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          DEPLOY_SCRIPT='#!/bin/bash
          cd /opt/gogidix/jars
          for jar in config-service-1.0.0.jar tenant-org-service-1.0.0.jar service-registry-discovery-1.0.0.jar monitoring-service-1.0.0.jar dashboard-configuration-service-1.0.0.jar; do
            echo "Downloading $jar..."
            ossutil64 cp "oss://gogidix-platform-assets/deploy/$jar" "/opt/gogidix/jars/$jar" -e oss-eu-central-1.aliyuncs.com -i LTAI5tBaGhMFMK1Yt7sJXuBA -k '"'$ALIBABA_SK'"' -f 2>/dev/null || echo "Skip $jar"
          done
          cd /opt/gogidix
          docker compose -f docker-compose-foundation.yml down
          sleep 5
          docker compose -f docker-compose-foundation.yml up -d
          echo "Deployment complete"'

          B64_SCRIPT=$(echo "$DEPLOY_SCRIPT" | base64 -w0)
          aliyun ecs RunCommand \
            --RegionId "${{ vars.ALIBABA_CLOUD_REGION || 'eu-central-1' }}" \
            --InstanceId.1 "${{ vars.ALIBABA_CLOUD_ECS_INSTANCE_ID || 'i-gw80uxaqcmiep4d2uqj5' }}" \
            --Type RunShellScript \
            --CommandContent "$B64_SCRIPT" \
            --ContentEncoding Base64 \
            --Timeout 300

      - name: Wait for services to start
        run: sleep 120

      - name: Health check
        run: |
          echo "Checking Foundation services health..."
          for svc in "service-registry:8333" "config-service:8080" "tenant-org:8085" "monitoring:8091" "dashboard-config:8200"; do
            name=$(echo $svc | cut -d: -f1)
            port=$(echo $svc | cut -d: -f2)
            status=$(curl -s -o /dev/null -w "%{http_code}" http://8.220.73.6:$port/actuator/health 2>/dev/null || echo "000")
            echo "$name ($port): HTTP $status"
          done

  deploy-production:
    name: "🚀 Deploy Production (TBD)"
    needs: docker-build
    if: inputs.deploy_env == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Production deployment placeholder
        run: |
          echo "Production deployment will be configured once staging is approved."
          echo "Target: dedicated Alibaba Cloud production infrastructure."

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: "📢 Notify Team"
    needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''

  summary:
    name: "📋 Pipeline Summary"
    needs: [publish-shared-libraries, central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, code-quality, security-scan, docker-build, notify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## Foundation-Domain Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Subdomain | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Publish Shared Libraries | ${{ needs.publish-shared-libraries.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚙️ Central Configuration | ${{ needs.central-configuration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Shared Infrastructure | ${{ needs.shared-infrastructure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Orchestration Services | ${{ needs.orchestration-services.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Centralized Dashboard | ${{ needs.centralized-dashboard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Gate | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📢 Notify | ${{ needs.notify.result }} |" >> $GITHUB_STEP_SUMMARY
