  code-quality:
    name: "📊 Code Quality Gate (Semgrep)"
    needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, shared-models]
    if: |
      (inputs.run_code_quality == true || inputs.run_code_quality == 'true' || inputs.run_code_quality == '') &&
      needs.central-configuration.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  security-scan:
    name: "🔒 Security Gate"
    needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, shared-models]
    if: |
      (inputs.run_security_scan == true || inputs.run_security_scan == 'true' || inputs.run_security_scan == '') &&
      needs.central-configuration.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Secret Scan
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          extra_args: --only-verified --no-git-history

  docker-build:
    name: "🐳 Docker Build & Push"
    needs: [code-quality, security-scan]
    if: |
      always() &&
      needs.code-quality.result != 'failed' &&
      needs.security-scan.result != 'failed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-jars'
          path: artifacts
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          DOCKERFILE=docker/Dockerfile.service
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          declare -A SERVICE_PORTS=(
            [service-registry-discovery]=8761
            [config-service]=8080
            [tenant-org-service]=8085
            [monitoring-service]=8091
            [dashboard-configuration-service]=8200
            [api-gateway]=8304
            [feature-flags-service]=8100
            [dynamic-routing-config-service]=8102
            [rate-limit-policy-service]=8104
            [release-rollout-config-service]=8105
            [tenancy-configuration-service]=8106
            [dashboard-analytics-service]=8201
            [dashboard-reporting-service]=8202
            [country-aggregation-service]=8095
            [executive-aggregation-service]=8096
            [mechanics-vendors-bridge-service]=8097
            [common-domain-models]=8261
            [country-localization-config-service]=8262
            [user-profile-service]=8310
            [access-control-service]=8311
            [alerting-service]=8312
            [api-keys-service]=8313
            [audit-correlation-service]=8314
            [database-management-service]=8315
            [event-audit-service]=8316
            [idempotency-service]=8317
            [identity-access-service]=8318
            [identity-service]=8319
            [integration-adapters-service]=8320
            [logging-aggregation-service]=8321
            [mechanics-gps-tracker-service]=8322
            [mechanics-insurance-bridge-service]=8323
            [metrics-telemetry-service]=8324
            [mfa-service]=8325
            [rate-limiting-service]=8326
            [request-routing-service]=8327
            [service-health-monitor]=8328
            [service-health-monitor-service]=8329
            [session-token-service]=8330
            [waf-policy-service]=8331
          )

          IMAGE_COUNT=0

          while IFS= read -r jar; do
            SERVICE_NAME=$(basename "$jar" .jar)

            IMAGE_NAME=$(echo "$SERVICE_NAME" | tr '_' '-' | tr '[:upper:]' '[:lower:]')
            GHCR_IMAGE="ghcr.io/${REPO_LOWER}/${IMAGE_NAME}"
            PORT=${SERVICE_PORTS[$SERVICE_NAME]:-8080}

            BUILD_CTX=$(mktemp -d)
            cp "$jar" "$BUILD_CTX/app.jar"
            cp "$DOCKERFILE" "$BUILD_CTX/Dockerfile"

            echo "::group::Building and pushing ${IMAGE_NAME} (port ${PORT})"
            docker buildx build --push \
              --build-arg SERVICE_PORT="${PORT}" \
              -t "${GHCR_IMAGE}:${{ github.sha }}" \
              -t "${GHCR_IMAGE}:${SHORT_SHA}" \
              -t "${GHCR_IMAGE}:latest" \
              "$BUILD_CTX"
            echo "::endgroup::"

            echo "Built and pushed ${IMAGE_NAME}"
            IMAGE_COUNT=$((IMAGE_COUNT + 1))

            rm -rf "$BUILD_CTX"
          done < <(find artifacts -name "*.jar" -type f)

          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "::error::No Docker images were built"
            exit 1
          fi

          echo "### Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Images built and pushed: **${IMAGE_COUNT}**" >> $GITHUB_STEP_SUMMARY

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  smoke-test:
    name: "🧪 Smoke Test"
    needs: [docker-build]
    if: always() && needs.docker-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get runner public IP
        id: runner-ip
        run: echo "ip=$(curl -sf https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Whitelist runner IP on MongoDB Atlas
        run: |
          RUNNER_IP="${{ steps.runner-ip.outputs.ip }}"
          echo "Whitelisting CI runner IP: ${RUNNER_IP}"
          RESPONSE=$(curl -sf -u "${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}:${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}" \
            --digest \
            -X POST \
            "https://cloud.mongodb.com/api/atlas/v2/groups/${{ secrets.MONGODB_ATLAS_PROJECT_ID }}/accessList" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.atlas.2024-08-05+json" \
            -d "[{\"ipAddress\":\"${RUNNER_IP}\",\"comment\":\"CI smoke-test $(date -u +%Y%m%d%H%M)\"}]" 2>&1) || {
              echo "::warning::Atlas whitelist API call failed (may already exist): ${RESPONSE}"
            }
          echo "Waiting 15s for Atlas IP whitelist propagation..."
          sleep 15

      - name: Pull Docker images
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          for img in service-registry-discovery config-service tenant-org-service monitoring-service dashboard-configuration-service; do
            echo "Pulling ${img}..."
            docker pull "ghcr.io/${REPO_LOWER}/${img}:${SHORT_SHA}"
          done

      - name: Start services
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          export GHCR_REPO="ghcr.io/${REPO_LOWER}"
          export IMAGE_TAG="${SHORT_SHA}"
          export MONGODB_URI="${{ secrets.MONGODB_URI }}"
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::MONGODB_URI secret is not set. Smoke test requires MongoDB Atlas connection string."
            exit 1
          fi
          docker compose -f docker/docker-compose.smoke.yml up -d

      - name: Wait for services and run health checks
        id: health-check
        run: |
          declare -A SERVICES=(
            [service-registry]=8761
            [config-service]=8080
            [tenant-org-service]=8085
            [monitoring-service]=8091
            [dashboard-configuration-service]=8200
          )

          TIMEOUT=180
          PASS=0
          FAIL=0
          RESULTS=""

          for svc in "${!SERVICES[@]}"; do
            PORT="${SERVICES[$svc]}"
            echo "::group::Waiting for ${svc} (port ${PORT})"
            ELAPSED=0
            HEALTHY=false
            while [ $ELAPSED -lt $TIMEOUT ]; do
              HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' "http://localhost:${PORT}/actuator/health" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "${svc}: HEALTHY (${HTTP_CODE}) after ${ELAPSED}s"
                HEALTHY=true
                break
              fi
              if [ "$HTTP_CODE" != "000" ]; then
                echo "  ${ELAPSED}s: HTTP ${HTTP_CODE} (waiting for 200)"
              else
                echo "  ${ELAPSED}s: no response yet"
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if $HEALTHY; then
              PASS=$((PASS + 1))
              RESULTS="${RESULTS}| ${svc} | :white_check_mark: HEALTHY |\n"
            else
              FAIL=$((FAIL + 1))
              RESULTS="${RESULTS}| ${svc} | :x: UNHEALTHY |\n"
              echo "::error::${svc} failed health check on port ${PORT} within ${TIMEOUT}s"
              docker logs "smoke-${svc}" 2>&1 | tail -50
            fi
            echo "::endgroup::"
          done

          echo "pass=${PASS}" >> "$GITHUB_OUTPUT"
          echo "fail=${FAIL}" >> "$GITHUB_OUTPUT"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo -e "$RESULTS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Passed: **${PASS}/5** | Failed: **${FAIL}/5**" >> $GITHUB_STEP_SUMMARY

          if [ "${FAIL}" -gt 0 ]; then
            echo "::error::${FAIL} service(s) failed smoke test"
            exit 1
          fi

      - name: Collect container logs on failure
        if: always() && steps.health-check.outputs.fail != '0'
        run: |
          for svc in service-registry config-service tenant-org-service monitoring-service dashboard-configuration-service; do
            echo "=== ${svc} logs ==="
            docker logs "smoke-${svc}" 2>&1 | tail -100
            echo ""
          done

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker/docker-compose.smoke.yml down -v --remove-orphans 2>/dev/null || true

      - name: Remove runner IP from MongoDB Atlas
        if: always()
        run: |
          RUNNER_IP="${{ steps.runner-ip.outputs.ip }}"
          echo "Removing CI runner IP from Atlas: ${RUNNER_IP}"
          curl -sf -u "${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}:${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}" \
            --digest \
            -X DELETE \
            "https://cloud.mongodb.com/api/atlas/v2/groups/${{ secrets.MONGODB_ATLAS_PROJECT_ID }}/accessList/${RUNNER_IP}" \
            -H "Accept: application/vnd.atlas.2024-08-05+json" 2>&1 || {
              echo "::warning::Failed to remove Atlas IP (may have already been removed)"
            }

  trigger-infra-deploy:
    name: "🚀 Trigger Infrastructure Deploy"
    needs: [smoke-test]
    if: >-
      always() &&
      needs.smoke-test.result == 'success' &&
      (github.ref == 'refs/heads/staging/uat' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger infrastructure deploy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_SECRET }}
          script: |
            const [owner, repo] = '${{ github.repository }}'.split('/');
            const infraRepo = '${{ vars.INFRA_REPO_NAME || 'Gogidix-Road-assist/infrastructure' }}'.split('/');
            const shortSha = '${{ github.sha }}'.substring(0, 7);
            const environment = '${{ github.ref }}'.includes('production') ? 'production' : 'staging';

            await github.rest.repos.createDispatchEvent({
              owner: infraRepo[0],
              repo: infraRepo[1],
              event_type: 'deploy-domain',
              client_payload: {
                domain: 'foundation-domain',
                environment: environment,
                image_tag: shortSha,
                full_sha: '${{ github.sha }}',
                triggered_by: '${{ github.actor }}',
                source_repo: '${{ github.repository }}',
                source_run_id: '${{ github.run_id }}'
              }
            });

            console.log(`Triggered deploy of foundation-domain (${environment}) with tag ${shortSha}`);

  notify:
    name: "Notify Team"
    needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, shared-models]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''

  summary:
    name: "Pipeline Summary"
    needs: [publish-shared-libraries, central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, shared-models, code-quality, security-scan, docker-build, smoke-test, trigger-infra-deploy, notify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## Foundation-Domain Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Subdomain | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Publish Shared Libraries | ${{ needs.publish-shared-libraries.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Central Configuration | ${{ needs.central-configuration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared Infrastructure | ${{ needs.shared-infrastructure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Orchestration Services | ${{ needs.orchestration-services.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Centralized Dashboard | ${{ needs.centralized-dashboard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared Models | ${{ needs.shared-models.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Gate | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger Infra Deploy | ${{ needs.trigger-infra-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Notify | ${{ needs.notify.result }} |" >> $GITHUB_STEP_SUMMARY
