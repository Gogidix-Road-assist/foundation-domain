name: Foundation-Domain CI/CD

on:
  push:
    branches: [main, dev, staging/uat, production, hotfix]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run unit tests'
        required: true
        default: true
        type: boolean
      run_security_scan:
        description: 'Run security scans (Snyk, TruffleHog)'
        required: true
        default: true
        type: boolean
      run_code_quality:
        description: 'Run code quality checks (Semgrep)'
        required: true
        default: true
        type: boolean
      deploy_env:
        description: 'Deploy to environment'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - staging
          - production

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish-shared-libraries:
    name: "📦 Publish Shared Libraries"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build all shared libraries
        working-directory: shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -q

      - name: Deploy root reactor POM
        run: |
          mvn deploy -DskipTests -N -DaltDeploymentRepository=github::https://maven.pkg.github.com/Gogidix-Road-assist/foundation-domain > deploy.log 2>&1 || true
          DEPLOY_EXIT=$(grep -c "BUILD SUCCESS" deploy.log || echo "0")
          if [ "$DEPLOY_EXIT" -eq 0 ]; then
            if grep -q "409" deploy.log; then
              echo "## :warning: Root POM: version 1.0.0 already published (409)" >> $GITHUB_STEP_SUMMARY
              echo "::warning::Root POM version 1.0.0 already published (409). Code changes will NOT be published until version is bumped."
            else
              echo "## :x: Root POM deploy FAILED" >> $GITHUB_STEP_SUMMARY
              echo "::error::Root POM deploy failed (non-409 error)"
              cat deploy.log
              exit 1
            fi
          else
            echo "## :white_check_mark: Root POM: deployed 1.0.0" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy all shared libraries
        run: |
          DEPLOY_OK=0
          DEPLOY_SKIP=0
          DEPLOY_FAIL=0
          echo "| Library | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          for module in shared-libraries/Backend/Java/shared-audit-library \
                        shared-libraries/Backend/Java/shared-cors-config \
                        shared-libraries/Backend/Java/shared-dto-library \
                        shared-libraries/Backend/Java/shared-exception-library \
                        shared-libraries/Backend/Java/shared-idempotency-library \
                        shared-libraries/Backend/Java/shared-mapper-library \
                        shared-libraries/Backend/Java/shared-observability-library \
                        shared-libraries/Backend/Java/shared-persistence-library \
                        shared-libraries/Backend/Java/shared-request-context-library \
                        shared-libraries/Backend/Java/shared-security-library \
                        shared-libraries/Backend/Java/shared-validation-library; do
            lib_name=$(basename "${module}")
            mvn deploy -DskipTests -f "${module}/pom.xml" \
              -DaltDeploymentRepository=github::https://maven.pkg.github.com/Gogidix-Road-assist/foundation-domain > deploy.log 2>&1 || true
            DEPLOY_OK_NOW=$(grep -c "BUILD SUCCESS" deploy.log || echo "0")
            if [ "$DEPLOY_OK_NOW" -eq 0 ]; then
              if grep -q "409" deploy.log; then
                DEPLOY_SKIP=$((DEPLOY_SKIP + 1))
                echo "| ${lib_name} | :warning: Already published (409) |" >> $GITHUB_STEP_SUMMARY
              else
                DEPLOY_FAIL=$((DEPLOY_FAIL + 1))
                echo "| ${lib_name} | :x: FAILED |" >> $GITHUB_STEP_SUMMARY
                echo "::error::Deploy FAILED for ${lib_name} (non-409 error)"
                cat deploy.log
              fi
            else
              DEPLOY_OK=$((DEPLOY_OK + 1))
              echo "| ${lib_name} | :white_check_mark: Deployed |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary**: ${DEPLOY_OK} deployed, ${DEPLOY_SKIP} skipped (409), ${DEPLOY_FAIL} failed" >> $GITHUB_STEP_SUMMARY
          if [ "${DEPLOY_FAIL}" -gt 0 ]; then
            echo "::error::${DEPLOY_FAIL} library deploy(s) failed with non-409 errors"
            exit 1
          fi
          if [ "${DEPLOY_SKIP}" -gt 0 ] && [ "${DEPLOY_OK}" -eq 0 ]; then
            echo "::warning::All ${DEPLOY_SKIP} libraries skipped (409). Code changes will NOT be published until version is bumped from 1.0.0."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  central-configuration:
    name: "⚙️ Central-Configuration (Build → Test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build shared libraries
        working-directory: shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -q

      - name: Build and package
        working-directory: central-configuration/Backend/Java
        run: mvn clean package -DskipTests

      - name: Run Tests
        if: inputs.run_tests != false
        working-directory: central-configuration/Backend/Java
        run: mvn test org.jacoco:jacoco-maven-plugin:report

      - name: Upload Coverage
        if: inputs.run_tests != false
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: central-configuration/**/target/site/jacoco/jacoco.xml
          flags: central-configuration
          fail_ci_if_error: false

      - name: Collect JAR artifacts
        run: |
          mkdir -p /tmp/jars
          find central-configuration/Backend/Java -name "*.jar" -path "*/target/*" \
            ! -name "original-*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | while read jar; do
            service=$(basename "$jar" | sed 's/-[0-9].*//')
            cp "$jar" "/tmp/jars/${service}.jar"
          done
          JAR_COUNT=$(ls /tmp/jars/*.jar 2>/dev/null | wc -l)
          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "::error::No JAR artifacts found for central-configuration"
            exit 1
          fi
          echo "Collected ${JAR_COUNT} JAR(s)"

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: central-configuration-jars
          path: /tmp/jars/
          if-no-files-found: error
          retention-days: 1

  shared-infrastructure:
