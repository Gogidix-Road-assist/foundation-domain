name: Foundation-Domain CI/CD

on:
  push:
    branches: [main, dev, staging/uat, production, hotfix]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run unit tests'
        required: true
        default: true
        type: boolean
      run_security_scan:
        description: 'Run security scans (Snyk, TruffleHog)'
        required: true
        default: true
        type: boolean
      run_code_quality:
        description: 'Run code quality checks (Semgrep)'
        required: true
        default: true
        type: boolean
      build_docker:
        description: 'Build and scan Docker images'
        required: true
        default: false
        type: boolean
      deploy_env:
        description: 'Deploy to environment'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - staging
          - production

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ===========================================
  # STEP 1: SHARED LIBRARIES (builds first)
  # ===========================================
  shared-libraries:
    name: 📚 Shared Libraries (Build → Test → Publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Compile
        working-directory: shared-libraries/Backend/Java
        run: mvn clean compile -DskipTests

      - name: Checkstyle
        working-directory: shared-libraries/Backend/Java
        run: mvn checkstyle:check -DskipTests -Dcheckstyle.config.location="file:///${{ github.workspace }}/checkstyle.xml"

      - name: Run Tests
        if: inputs.run_tests != false
        working-directory: shared-libraries/Backend/Java
        run: mvn test org.jacoco:jacoco-maven-plugin:report

      - name: Package
        working-directory: shared-libraries/Backend/Java
        run: mvn package -DskipTests

      - name: Deploy root reactor POM
        working-directory: .
        run: |
          mvn deploy -DskipTests -N -DaltDeploymentRepository=github::https://maven.pkg.github.com/Gogidix-Road-assist/foundation-domain 2>&1 | tee root-deploy.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            if grep -q "409" root-deploy.log; then
              echo "::warning::Root POM version already published (409). Skipping."
              exit 0
            else
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        working-directory: shared-libraries/Backend/Java
        run: |
          mvn deploy -DskipTests -DaltDeploymentRepository=github::https://maven.pkg.github.com/Gogidix-Road-assist/foundation-domain 2>&1 | tee deploy.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            if grep -q "409" deploy.log; then
              echo "::warning::Version already published (409). Skipping."
              exit 0
            else
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Coverage
        if: inputs.run_tests != false
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: shared-libraries/Backend/Java/**/target/site/jacoco/jacoco.xml
          flags: shared-libraries
          fail_ci_if_error: true

  # ===========================================
  # STEP 2: CENTRAL CONFIGURATION
  # ===========================================
  central-configuration:
    name: ⚙️ Central Configuration (Build → Test)
    needs: shared-libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root reactor POM
        run: mvn install -DskipTests -N -q

      - name: Install shared-libraries
        working-directory: shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -q

      - name: Compile
        working-directory: central-configuration/Backend/Java
        run: mvn clean compile -DskipTests

      - name: Checkstyle
        working-directory: central-configuration/Backend/Java
        run: mvn checkstyle:check -DskipTests -Dcheckstyle.config.location="file:///${{ github.workspace }}/checkstyle.xml"

      - name: Run Tests
        if: inputs.run_tests != false
        working-directory: central-configuration/Backend/Java
        run: mvn test org.jacoco:jacoco-maven-plugin:report

      - name: Package
        working-directory: central-configuration/Backend/Java
        run: mvn package -DskipTests

      - name: Upload Coverage
        if: inputs.run_tests != false
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: central-configuration
          fail_ci_if_error: true

  # ===========================================
  # STEP 3: SHARED INFRASTRUCTURE
  # ===========================================
  shared-infrastructure:
    name: 🏗️ Shared Infrastructure (Build → Test)
    needs: shared-libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root reactor POM
        run: mvn install -DskipTests -N -q

      - name: Install shared-libraries
        working-directory: shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -q

      - name: Compile
        working-directory: shared-infrastructure/Backend/Java
        run: mvn clean compile -DskipTests

      - name: Checkstyle
        working-directory: shared-infrastructure/Backend/Java
        run: mvn checkstyle:check -DskipTests -Dcheckstyle.config.location="file:///${{ github.workspace }}/checkstyle.xml"

      - name: Run Tests
        if: inputs.run_tests != false
        working-directory: shared-infrastructure/Backend/Java
        run: mvn test org.jacoco:jacoco-maven-plugin:report

      - name: Package
        working-directory: shared-infrastructure/Backend/Java
        run: mvn package -DskipTests

      - name: Upload Coverage
        if: inputs.run_tests != false
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: shared-infrastructure
          fail_ci_if_error: true

  # ===========================================
  # STEP 4: ORCHESTRATION SERVICES
  # ===========================================
  orchestration-services:
    name: 🎯 Orchestration Services (Build → Test)
    needs: shared-libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root reactor POM
        run: mvn install -DskipTests -N -q

      - name: Install shared-libraries
        working-directory: shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -q

      - name: Compile
        working-directory: orchestration-services/Backend/Java
        run: mvn clean compile -DskipTests

      - name: Checkstyle
        working-directory: orchestration-services/Backend/Java
        run: mvn checkstyle:check -DskipTests -Dcheckstyle.config.location="file:///${{ github.workspace }}/checkstyle.xml"

      - name: Run Tests
        if: inputs.run_tests != false
        working-directory: orchestration-services/Backend/Java
        run: mvn test org.jacoco:jacoco-maven-plugin:report

      - name: Package
        working-directory: orchestration-services/Backend/Java
        run: mvn package -DskipTests

  # ===========================================
  # STEP 5: CENTRALIZED DASHBOARD
  # ===========================================
  centralized-dashboard:
    name: 📊 Centralized Dashboard (Build → Test)
    needs: shared-libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root reactor POM
        run: mvn install -DskipTests -N -q

      - name: Install shared-libraries
        working-directory: shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -q

      - name: Compile
        working-directory: centralized-dashboard/Backend/Java
        run: mvn clean compile -DskipTests

      - name: Checkstyle
        working-directory: centralized-dashboard/Backend/Java
        run: mvn checkstyle:check -DskipTests -Dcheckstyle.config.location="file:///${{ github.workspace }}/checkstyle.xml"

      - name: Run Tests
        if: inputs.run_tests != false
        working-directory: centralized-dashboard/Backend/Java
        run: mvn test org.jacoco:jacoco-maven-plugin:report

      - name: Package
        working-directory: centralized-dashboard/Backend/Java
        run: mvn package -DskipTests

  # ===========================================
  # GATE: CODE QUALITY (after all builds pass)
  # ===========================================
  code-quality:
    name: 📊 Code Quality Gate (Semgrep)
    needs: [shared-libraries, central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard]
    if: |
      (inputs.run_code_quality == true || inputs.run_code_quality == 'true' || inputs.run_code_quality == '') &&
      needs.shared-libraries.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ===========================================
  # GATE: SECURITY (after all builds pass)
  # ===========================================
  security-scan:
    name: 🔒 Security Gate
    needs: [shared-libraries, central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard]
    if: |
      (inputs.run_security_scan == true || inputs.run_security_scan == 'true' || inputs.run_security_scan == '') &&
      needs.shared-libraries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Secret Scan
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          extra_args: --only-verified

  # ===========================================
  # DOCKER BUILD (after all tests pass)
  # ===========================================
  docker-build:
    name: 🐳 Docker Build & Scan
    needs: [code-quality, security-scan]
    if: |
      (inputs.build_docker == true || inputs.build_docker == 'true') &&
      needs.code-quality.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find services with Dockerfiles
        id: find-services
        run: |
          SERVICES=$(find . -maxdepth 5 -name "Dockerfile" -exec dirname {} \; | sed 's|^\./||' | sort)
          echo "services=$(echo "$SERVICES" | head -20 | jq -R . | jq -s .)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and scan images
        run: |
          echo "Docker build step - services found: ${{ steps.find-services.outputs.services }}"

  # ===========================================
  # DEPLOY STAGING
  # ===========================================
  deploy-staging:
    name: 🚀 Deploy Staging
    needs: docker-build
    if: inputs.deploy_env == 'staging' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://foundation-staging.onrender.com
    steps:
      - name: Deploy
        run: curl -X POST ${{ secrets.RENDER_STAGING_WEBHOOK }}

  # ===========================================
  # DEPLOY PRODUCTION
  # ===========================================
  deploy-production:
    name: 🚀 Deploy Production
    needs: docker-build
    if: inputs.deploy_env == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://foundation.onrender.com
    steps:
      - name: Deploy
        run: curl -X POST ${{ secrets.RENDER_PRODUCTION_WEBHOOK }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================
  # NOTIFY
  # ===========================================
  notify:
    name: 📢 Notify Team
    needs: [shared-libraries, central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''

  # ===========================================
  # SUMMARY
  # ===========================================
  summary:
    name: 📋 Pipeline Summary
    needs: [shared-libraries, central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, code-quality, security-scan, notify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## Foundation-Domain Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Subdomain | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 Shared Libraries | ${{ needs.shared-libraries.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚙️ Central Configuration | ${{ needs.central-configuration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Shared Infrastructure | ${{ needs.shared-infrastructure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Orchestration Services | ${{ needs.orchestration-services.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Centralized Dashboard | ${{ needs.centralized-dashboard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Code Quality (Semgrep) | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Gate | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📢 Notify | ${{ needs.notify.result }} |" >> $GITHUB_STEP_SUMMARY
