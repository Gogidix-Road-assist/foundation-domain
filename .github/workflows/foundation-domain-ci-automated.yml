          fi
          echo "Collected ${JAR_COUNT} JAR(s)"

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-infrastructure-jars
          path: /tmp/jars/
          if-no-files-found: error
          retention-days: 1

  orchestration-services:
    name: "🎯 Orchestration-Services (Build → Test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
