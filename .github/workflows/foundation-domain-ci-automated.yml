name: Foundation-Domain CI/CD

on:
  push:
    branches: [main, dev, staging/uat, production, hotfix]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run unit tests'
        required: true
        default: true
        type: boolean
      run_security_scan:
        description: 'Run security scans (Snyk, TruffleHog)'
        required: true
        default: true
        type: boolean
      run_code_quality:
        description: 'Run code quality checks (Semgrep)'
        required: true
        default: true
        type: boolean
      deploy_env:
        description: 'Deploy to environment'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - staging
          - production

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish-shared-libraries:
    name: "📦 Publish Shared Libraries"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build all shared libraries
        working-directory: shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -q

      - name: Deploy root reactor POM
        run: |
          mvn deploy -DskipTests -N -DaltDeploymentRepository=github::https://maven.pkg.github.com/Gogidix-Road-assist/foundation-domain 2>&1 | tee deploy.log || {
            if grep -q "409" deploy.log; then
              echo "::warning::Version already published (409). Skipping."
            else
              echo "::error::Root POM deploy failed"
              cat deploy.log
              exit 1
            fi
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy all shared libraries
        run: |
          for module in shared-libraries/Backend/Java/shared-audit-library \
                        shared-libraries/Backend/Java/shared-cors-config \
                        shared-libraries/Backend/Java/shared-dto-library \
                        shared-libraries/Backend/Java/shared-exception-library \
                        shared-libraries/Backend/Java/shared-idempotency-library \
                        shared-libraries/Backend/Java/shared-mapper-library \
                        shared-libraries/Backend/Java/shared-observability-library \
                        shared-libraries/Backend/Java/shared-persistence-library \
                        shared-libraries/Backend/Java/shared-request-context-library \
                        shared-libraries/Backend/Java/shared-security-library \
                        shared-libraries/Backend/Java/shared-validation-library; do
            mvn deploy -DskipTests -f "${module}/pom.xml" \
              -DaltDeploymentRepository=github::https://maven.pkg.github.com/Gogidix-Road-assist/foundation-domain 2>&1 | tee deploy.log || {
              if grep -q "409" deploy.log; then
                echo "::warning::Version already published (409). Skipping ${module}."
              else
                echo "::error::Deploy failed for ${module}"
                cat deploy.log
                exit 1
              fi
            }
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  central-configuration:
    name: "⚙️ Central-Configuration (Build → Test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build with dependencies
        run: mvn clean install -Dmaven.test.skip=true -pl central-configuration/Backend/Java -am

      - name: Run Tests
        if: inputs.run_tests != false
        run: mvn test org.jacoco:jacoco-maven-plugin:report -pl central-configuration/Backend/Java

      - name: Package
        run: mvn package -DskipTests -pl central-configuration/Backend/Java

      - name: Upload Coverage
        if: inputs.run_tests != false
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: central-configuration/**/target/site/jacoco/jacoco.xml
          flags: central-configuration
          fail_ci_if_error: false

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: central-configuration-jars
          path: central-configuration/Backend/Java/**/target/*.jar
          retention-days: 1

  shared-infrastructure:
    name: "🏗️ Shared-Infrastructure (Build → Test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build with dependencies
        run: mvn clean install -Dmaven.test.skip=true -pl shared-infrastructure/Backend/Java -am

      - name: Run Tests
        if: inputs.run_tests != false
        run: mvn test org.jacoco:jacoco-maven-plugin:report -pl shared-infrastructure/Backend/Java

      - name: Package
        run: mvn package -DskipTests -pl shared-infrastructure/Backend/Java

      - name: Upload Coverage
        if: inputs.run_tests != false
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: shared-infrastructure/**/target/site/jacoco/jacoco.xml
          flags: shared-infrastructure
          fail_ci_if_error: false

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-infrastructure-jars
          path: shared-infrastructure/Backend/Java/**/target/*.jar
          retention-days: 1

  orchestration-services:
    name: "🎯 Orchestration-Services (Build → Test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build with dependencies
        run: mvn clean install -Dmaven.test.skip=true -pl orchestration-services/Backend/Java -am

      - name: Run Tests
        if: inputs.run_tests != false
        run: mvn test org.jacoco:jacoco-maven-plugin:report -pl orchestration-services/Backend/Java

      - name: Package
        run: mvn package -DskipTests -pl orchestration-services/Backend/Java

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-services-jars
          path: orchestration-services/Backend/Java/**/target/*.jar
          retention-days: 1

  centralized-dashboard:
    name: "📊 Centralized-Dashboard (Build → Test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install root POM
        run: mvn install -DskipTests -N -q

      - name: Build with dependencies
        run: mvn clean install -Dmaven.test.skip=true -pl centralized-dashboard/Backend/Java -am

      - name: Run Tests
        if: inputs.run_tests != false
        run: mvn test org.jacoco:jacoco-maven-plugin:report -pl centralized-dashboard/Backend/Java

      - name: Package
        run: mvn package -DskipTests -pl centralized-dashboard/Backend/Java

      - name: Upload Coverage
        if: inputs.run_tests != false
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: centralized-dashboard/**/target/site/jacoco/jacoco.xml
          flags: centralized-dashboard
          fail_ci_if_error: false

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: centralized-dashboard-jars
          path: centralized-dashboard/Backend/Java/**/target/*.jar
          retention-days: 1

  code-quality:
    name: "📊 Code Quality Gate (Semgrep)"
    needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard]
    if: |
      (inputs.run_code_quality == true || inputs.run_code_quality == 'true' || inputs.run_code_quality == '') &&
      needs.central-configuration.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  security-scan:
    name: "🔒 Security Gate"
    needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard]
    if: |
      (inputs.run_security_scan == true || inputs.run_security_scan == 'true' || inputs.run_security_scan == '') &&
      needs.central-configuration.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Run Snyk
        if: vars.SNYK_ENABLED != 'false'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN secret is not configured"
            exit 1
          fi
          npm install -g snyk snyk-to-html
          snyk test --severity-threshold=high --fail-on=all

      - name: Secret Scan
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          extra_args: --only-verified

  docker-build:
    name: "🐳 Docker Build & Push"
    needs: [code-quality, security-scan]
    if: |
      always() &&
      needs.code-quality.result != 'failed' &&
      needs.security-scan.result != 'failed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-jars'
          path: artifacts
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          DOCKERFILE=docker/Dockerfile.service
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          declare -A SERVICE_PORTS=(
            [service-registry-discovery]=8333
            [config-service]=8080
            [tenant-org-service]=8085
            [monitoring-service]=8091
            [dashboard-configuration-service]=8200
            [api-gateway]=8304
            [feature-flags-service]=8100
            [dynamic-routing-config-service]=8102
            [rate-limit-policy-service]=8104
            [release-rollout-config-service]=8105
            [tenancy-configuration-service]=8106
            [dashboard-analytics-service]=8201
            [dashboard-reporting-service]=8202
            [mechanics-vendors-bridge-service]=8097
            [mechanics-insurance-bridge-service]=8096
            [mechanics-gps-tracker-service]=8098
          )

          IMAGE_COUNT=0

          while IFS= read -r jar; do
            SERVICE_NAME=$(echo "$jar" | sed -n 's|.*/Backend/Java/\([^/]*\)/target/.*|\1|p')

            if [ -z "$SERVICE_NAME" ]; then
              continue
            fi

            if ! unzip -l "$jar" 2>/dev/null | grep -q "BOOT-INF/"; then
              continue
            fi

            IMAGE_NAME=$(echo "$SERVICE_NAME" | tr '_' '-' | tr '[:upper:]' '[:lower:]')
            GHCR_IMAGE="ghcr.io/${REPO_LOWER}/${IMAGE_NAME}"
            PORT=${SERVICE_PORTS[$SERVICE_NAME]:-8080}

            BUILD_CTX=$(mktemp -d)
            cp "$jar" "$BUILD_CTX/app.jar"
            cp "$DOCKERFILE" "$BUILD_CTX/Dockerfile"

            echo "::group::Building and pushing ${IMAGE_NAME} (port ${PORT})"
            docker buildx build --push \
              --build-arg SERVICE_PORT="${PORT}" \
              -t "${GHCR_IMAGE}:${{ github.sha }}" \
              -t "${GHCR_IMAGE}:${SHORT_SHA}" \
              -t "${GHCR_IMAGE}:latest" \
              "$BUILD_CTX"
            echo "::endgroup::"

            echo "Built and pushed ${IMAGE_NAME}"
            IMAGE_COUNT=$((IMAGE_COUNT + 1))

            rm -rf "$BUILD_CTX"
          done < <(find artifacts -name "*.jar" ! -name "original-*" ! -name "*-sources.jar" ! -name "*-javadoc.jar")

          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "::error::No Docker images were built"
            exit 1
          fi

          echo "### Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Images built and pushed: **${IMAGE_COUNT}**" >> $GITHUB_STEP_SUMMARY

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  notify:
    name: "Notify Team"
    needs: [central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''

  summary:
    name: "Pipeline Summary"
    needs: [publish-shared-libraries, central-configuration, shared-infrastructure, orchestration-services, centralized-dashboard, code-quality, security-scan, docker-build, notify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## Foundation-Domain Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Subdomain | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Publish Shared Libraries | ${{ needs.publish-shared-libraries.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Central Configuration | ${{ needs.central-configuration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared Infrastructure | ${{ needs.shared-infrastructure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Orchestration Services | ${{ needs.orchestration-services.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Centralized Dashboard | ${{ needs.centralized-dashboard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Gate | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Notify | ${{ needs.notify.result }} |" >> $GITHUB_STEP_SUMMARY
