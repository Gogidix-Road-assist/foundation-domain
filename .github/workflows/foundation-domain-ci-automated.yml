name: Foundation-Domain CI/CD (Reactor Build)

on:
  push:
    branches: [main, dev, staging/uat, production, hotfix]
    paths:
      - 'shared-libraries/**'
      - 'central-configuration/**'
      - 'shared-infrastructure/**'
      - 'orchestration-services/**'
      - 'ai-services/**'
      - 'centralized-dashboard/**'
      - 'shared-frontend-libraries/**'
      - 'pom.xml'
      - 'checkstyle.xml'
      - '.github/workflows/foundation-domain-ci-automated.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'shared-libraries/**'
      - 'central-configuration/**'
      - 'shared-infrastructure/**'
      - 'orchestration-services/**'
      - 'ai-services/**'
      - 'centralized-dashboard/**'
      - 'shared-frontend-libraries/**'
      - 'pom.xml'
      - 'checkstyle.xml'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run unit tests'
        required: true
        default: true
        type: boolean
      run_security_scan:
        description: 'Run security scans (Snyk, TruffleHog)'
        required: true
        default: true
        type: boolean
      run_code_quality:
        description: 'Run code quality checks (Semgrep)'
        required: true
        default: true
        type: boolean
      build_docker:
        description: 'Build and scan Docker images'
        required: true
        default: false
        type: boolean
      deploy_env:
        description: 'Deploy to environment'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - staging
          - production
      maven_profile:
        description: 'Maven profile to use'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - dev
          - production

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ===========================
  # GATE 1: REACTOR BUILD
  # ===========================
  build:
    name: 🔨 Reactor Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build_success: ${{ steps.build_result.outputs.success }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Display build config
        run: |
          echo "=========================================="
          echo "Foundation-Domain Reactor Build"
          echo "  Run Tests: ${{ inputs.run_tests }}"
          echo "  Run Security Scan: ${{ inputs.run_security_scan }}"
          echo "  Run Code Quality: ${{ inputs.run_code_quality }}"
          echo "  Build Docker: ${{ inputs.build_docker }}"
          echo "  Deploy Environment: ${{ inputs.deploy_env }}"
          echo "  Maven Profile: ${{ inputs.maven_profile }}"
          echo "=========================================="

      - name: Build reactor (all modules)
        id: build_result
        run: |
          PROFILE="${{ inputs.maven_profile }}"
          if [ -n "$PROFILE" ] && [ "$PROFILE" != "default" ]; then
            mvn clean compile -P"$PROFILE" -DskipTests
          else
            mvn clean compile -DskipTests
          fi
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Checkstyle (all modules)
        if: success()
        run: |
          mvn checkstyle:check -DskipTests -Dcheckstyle.config.location="file:///${{ github.workspace }}/checkstyle.xml"

      - name: SpotBugs (all modules)
        if: success()
        run: |
          mvn spotbugs:check -DskipTests

  # ===========================
  # GATE 2: CODE QUALITY
  # ===========================
  code-quality:
    name: 📊 Code Quality Gate (Semgrep)
    needs: build
    if: |
      (inputs.run_code_quality == true || inputs.run_code_quality == 'true' || inputs.run_code_quality == '') &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep Scan
        uses: semgrep/semgrep@main
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ===========================
  # GATE 3: SECURITY
  # ===========================
  security-scan:
    name: 🔒 Security Gate
    needs: build
    if: |
      (inputs.run_security_scan == true || inputs.run_security_scan == 'true' || inputs.run_security_scan == '') &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Run Snyk to check for vulnerabilities
        if: vars.SNYK_ENABLED != 'false'
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=all

      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ===========================
  # GATE 4: TEST
  # ===========================
  test:
    name: 🧪 Test Gate (All Modules)
    needs: build
    if: |
      (inputs.run_tests == true || inputs.run_tests == 'true' || inputs.run_tests == '') &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Run Tests with Coverage (reactor)
        run: |
          mvn test -Dpitest.skip=true org.jacoco:jacoco-maven-plugin:report

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'

  # ===========================
  # PUBLISH SHARED LIBRARIES
  # ===========================
  publish-packages:
    name: 📦 Publish Shared Libraries
    needs: [build, test]
    if: |
      always() &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Deploy shared-libraries to GitHub Packages
        working-directory: shared-libraries/Backend/Java
        run: |
          mvn clean deploy -DskipTests -DaltDeploymentRepository=github::https://maven.pkg.github.com/Gogidix-Road-assist/foundation-domain 2>&1 | tee deploy.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            if grep -q "409" deploy.log; then
              echo "::warning::Version already published (409 Conflict). Skipping publish."
              exit 0
            else
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================
  # PREPARE DOCKER BUILD
  # ===========================
  prepare-docker:
    name: 🐳 Find Docker Services
    needs: test
    if: |
      always() &&
      (inputs.build_docker == true || inputs.build_docker == 'true') &&
      needs.test.result != 'failure'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find-services.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find services with Dockerfiles
        id: find-services
        run: |
          SERVICES=$(find . -maxdepth 5 -name "Dockerfile" -exec dirname {} \; | sed 's|^\./||' | sort)
          echo "$SERVICES" > /tmp/services.txt
          JSON="["
          FIRST=true
          while IFS= read -r service; do
            if [ -n "$service" ]; then
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                JSON="${JSON},"
              fi
              JSON="${JSON}\"${service}\""
            fi
          done < /tmp/services.txt
          JSON="${JSON}]"
          echo "services=${JSON}" >> $GITHUB_OUTPUT

  # ===========================
  # GATE 5: BUILD & SCAN IMAGE
  # ===========================
  docker-build:
    name: 🐳 Build ${{ matrix.service }}
    needs: prepare-docker
    if: |
      (inputs.build_docker == true || inputs.build_docker == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare-docker.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Build Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type:gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner for ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results for ${{ matrix.service }}
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

      - name: Push Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================
  # GATE 6: DEPLOY STAGING
  # ===========================
  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: docker-build
    runs-on: ubuntu-latest
    if: inputs.deploy_env == 'staging' && github.ref == 'refs/heads/dev' && needs.prepare-docker.result == 'success'
    environment:
      name: staging
      url: https://foundation-staging.onrender.com
    steps:
      - name: Deploy to Render Staging
        run: |
          curl -X POST ${{ secrets.RENDER_STAGING_WEBHOOK }}

      - name: Wait for deployment
        run: sleep 60

      - name: Health Check
        run: |
          curl -f https://foundation-staging.onrender.com/actuator/health

      - name: Run Smoke Tests
        run: |
          echo "Running smoke tests against staging..."

  # ===========================
  # GATE 7: DEPLOY PRODUCTION
  # ===========================
  deploy-production:
    name: 🚀 Deploy to Production
    needs: docker-build
    runs-on: ubuntu-latest
    if: inputs.deploy_env == 'production' && github.ref == 'refs/heads/main' && needs.prepare-docker.result == 'success'
    environment:
      name: production
      url: https://foundation.onrender.com
    steps:
      - name: Deploy to Render Production
        run: |
          curl -X POST ${{ secrets.RENDER_PRODUCTION_WEBHOOK }}

      - name: Wait for deployment
        run: sleep 60

      - name: Health Check
        run: |
          curl -f https://foundation.onrender.com/actuator/health

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================
  # NOTIFY
  # ===========================
  notify:
    name: 📢 Notify Team
    needs: [deploy-staging, deploy-production, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''

  # ===========================
  # SUMMARY REPORT
  # ===========================
  summary:
    name: 📋 Pipeline Summary
    needs: [build, code-quality, test, security-scan, publish-packages, prepare-docker, deploy-staging, deploy-production, notify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Reactor Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Code Quality (Semgrep) | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Publish Packages | ${{ needs.publish-packages.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Build | ${{ needs.prepare-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Deploy Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Deploy Production | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📢 Notify | ${{ needs.notify.result }} |" >> $GITHUB_STEP_SUMMARY
