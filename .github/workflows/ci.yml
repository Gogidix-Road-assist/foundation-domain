name: Foundation-Domain CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      central-config: ${{ steps.filter.outputs.central-config }}
      shared-infra: ${{ steps.filter.outputs.shared-infra }}
      orchestration: ${{ steps.filter.outputs.orchestration }}
      ai-services: ${{ steps.filter.outputs.ai-services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            central-config:
              - 'central-configuration/**'
            shared-infra:
              - 'shared-infrastructure/**'
            orchestration:
              - 'orchestration-services/**'
            ai-services:
              - 'ai-services/**'

  build-central-configuration:
    name: Build Central Configuration Services
    needs: detect-changes
    if: needs.detect-changes.outputs.central-config == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - config-service
          - feature-flags-service
          - policy-configuration-service
          - tenancy-configuration-service
      max-parallel: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Build ${{ matrix.service }}
        run: |
          cd central-configuration/Backend/Java/${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: central-configuration/Backend/Java/${{ matrix.service }}/target/*.jar
          retention-days: 7

  build-shared-infrastructure:
    name: Build Shared Infrastructure Services
    needs: detect-changes
    if: needs.detect-changes.outputs.shared-infra == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - identity-service
          - notification-service
          - payment-service
          - user-profile-service
          - tenant-org-service
          - service-registry-discovery
          - request-routing-service
          - service-health-monitor-service
          - reporting-read-model-service
          - waf-policy-service
      max-parallel: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Build ${{ matrix.service }}
        run: |
          cd shared-infrastructure/Backend/Java/${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: shared-infrastructure/Backend/Java/${{ matrix.service }}/target/*.jar
          retention-days: 7

  build-orchestration:
    name: Build Orchestration Services
    needs: detect-changes
    if: needs.detect-changes.outputs.orchestration == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - saga-orchestrator-service
          - event-sourcing-service
          - cqrs-command-service
          - cqrs-query-service
          - workflow-engine-service
          - state-machine-service
      max-parallel: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Build ${{ matrix.service }}
        run: |
          cd orchestration-services/Backend/Java/${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: orchestration-services/Backend/Java/${{ matrix.service }}/target/*.jar
          retention-days: 7

  build-ai-services:
    name: Build AI Services
    needs: detect-changes
    if: needs.detect-changes.outputs.ai-services == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ai-inference-service
          - model-registry-service
          - prediction-service
          - anomaly-detection-service
          - recommendation-service
      max-parallel: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Build ${{ matrix.service }}
        run: |
          cd ai-services/Backend/Java/${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ai-services/Backend/Java/${{ matrix.service }}/target/*.jar
          retention-days: 7

  build-shared-libraries:
    name: Build Shared Libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Build shared-domain-lib
        run: |
          cd shared-libraries/shared-domain-lib
          mvn clean install -DskipTests

      - name: Build shared-security-lib
        run: |
          cd shared-libraries/shared-security-lib
          mvn clean install -DskipTests

      - name: Build shared-logging-lib
        run: |
          cd shared-libraries/shared-logging-lib
          mvn clean install -DskipTests

  test:
    name: Run Tests
    needs: [build-central-configuration, build-shared-infrastructure, build-orchestration, build-ai-services]
    if: always() && (needs.build-central-configuration.result == 'success' || needs.build-shared-infrastructure.result == 'success' || needs.build-orchestration.result == 'success' || needs.build-ai-services.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Run Tests
        run: mvn test -DskipDockerTests=true
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  docker-build-push:
    name: Build and Push Docker Images
    needs: [build-central-configuration, build-shared-infrastructure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - identity-service
          - notification-service
          - config-service
      max-parallel: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ./target

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: docker-build-push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Render
        run: |
          echo "Deploying to Render staging environment"
          curl ${{ secrets.RENDER_STAGING_WEBHOOK }}

  deploy-production:
    name: Deploy to Production
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Render
        run: |
          echo "Deploying to Render production environment"
          curl ${{ secrets.RENDER_PRODUCTION_WEBHOOK }}
