name: Auto Promote

on:
  workflow_run:
    workflows: ["Foundation-Domain CI/CD"]
    types: [completed]
    branches: [dev]

jobs:
  promote-and-verify:
    name: "Promote dev → staging/uat & verify images"
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into staging/uat
        run: |
          git fetch origin staging/uat
          git checkout staging/uat
          git merge dev --no-edit
          git push origin staging/uat

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all required images exist
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)

          REQUIRED_IMAGES=(
            service-registry-discovery
            config-service
            tenant-org-service
            monitoring-service
            dashboard-configuration-service
          )

          echo "Verifying images for SHA: ${SHORT_SHA}"
          echo ""

          PASS=0
          FAIL=0
          for img in "${REQUIRED_IMAGES[@]}"; do
            IMAGE="ghcr.io/${REPO}/${img}:${SHORT_SHA}"
            echo "Checking ${IMAGE}..."
            if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
              echo "  OK: ${IMAGE}"
              PASS=$((PASS + 1))
            else
              echo "::error::Image not found in GHCR: ${IMAGE}"
              FAIL=$((FAIL + 1))
            fi
          done

          echo ""
          echo "### dev → staging/uat Promotion" >> $GITHUB_STEP_SUMMARY
          echo "Status: Merged and pushed" >> $GITHUB_STEP_SUMMARY
          echo "SHA: \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Verification" >> $GITHUB_STEP_SUMMARY
          echo "Passed: ${PASS}/${#REQUIRED_IMAGES[@]}" >> $GITHUB_STEP_SUMMARY
          echo "Failed: ${FAIL}/${#REQUIRED_IMAGES[@]}" >> $GITHUB_STEP_SUMMARY

          if [ "${FAIL}" -ne 0 ]; then
            echo "::error::${FAIL} image(s) not found in GHCR"
            exit 1
          fi
          echo "All ${#REQUIRED_IMAGES[@]} required images verified in GHCR"
