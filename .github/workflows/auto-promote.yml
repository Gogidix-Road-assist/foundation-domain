name: Auto Promote

on:
  workflow_run:
    workflows: ["Foundation-Domain CI/CD"]
    types: [completed]
    branches: [dev, staging/uat]

jobs:
  promote-dev-to-staging:
    name: "Promote dev to staging/uat"
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into staging/uat
        run: |
          git fetch origin staging/uat
          git checkout staging/uat
          git merge dev --no-edit
          git push origin staging/uat

      - name: Summary
        run: |
          echo "### dev → staging/uat Promotion" >> $GITHUB_STEP_SUMMARY
          echo "Status: Merged and pushed" >> $GITHUB_STEP_SUMMARY
          echo "SHA: \`${{ github.event.workflow_run.head_sha }}\`" >> $GITHUB_STEP_SUMMARY

  verify-staging-images:
    name: "Verify staging/uat images in GHCR"
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging/uat'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all required images exist
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)

          REQUIRED_IMAGES=(
            service-registry-discovery
            config-service
            tenant-org-service
            monitoring-service
            dashboard-configuration-service
          )

          echo "Verifying images for SHA: ${SHORT_SHA}"
          echo ""

          for img in "${REQUIRED_IMAGES[@]}"; do
            IMAGE="ghcr.io/${REPO}/${img}:${SHORT_SHA}"
            echo "Checking ${IMAGE}..."
            if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
              echo "  OK: ${IMAGE}"
            else
              echo "::error::Image not found in GHCR: ${IMAGE}"
              exit 1
            fi
          done

          echo ""
          echo "### Staging/uat Image Verification" >> $GITHUB_STEP_SUMMARY
          echo "All ${#REQUIRED_IMAGES[@]} required images verified in GHCR" >> $GITHUB_STEP_SUMMARY
          echo "SHA: \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
