name: Auto Promote

on:
  workflow_run:
    workflows: ["Foundation-Domain CI/CD"]
    types: [completed]
    branches: [dev]

jobs:
  promote-and-verify:
    name: "Promote dev → staging/uat & verify images"
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync staging/uat to dev
        run: |
          git fetch origin staging/uat 2>/dev/null || true
          if git rev-parse --verify origin/staging/uat >/dev/null 2>&1; then
            git checkout staging/uat
          else
            git checkout -b staging/uat dev
          fi
          git reset --hard dev
          git push origin staging/uat --force

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all required images exist
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ORG=$(echo "${REPO}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${REPO}" | cut -d'/' -f2)
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)

          REQUIRED_IMAGES=(
            service-registry-discovery
            config-service
            tenant-org-service
            monitoring-service
            dashboard-configuration-service
          )

          echo "Verifying images for SHA: ${SHORT_SHA}"
          echo ""

          PASS=0
          FAIL=0
          for img in "${REQUIRED_IMAGES[@]}"; do
            IMAGE="ghcr.io/${ORG}/${REPO_NAME}-${img}:${SHORT_SHA}"
            echo "Checking ${IMAGE}..."
            if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
              echo "  OK: ${IMAGE}"
              PASS=$((PASS + 1))
            else
              echo "::error::Image not found in GHCR: ${IMAGE}"
              FAIL=$((FAIL + 1))
            fi
          done

          echo ""
          echo "### dev → staging/uat Promotion" >> $GITHUB_STEP_SUMMARY
          echo "Status: Merged and pushed" >> $GITHUB_STEP_SUMMARY
          echo "SHA: \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Verification" >> $GITHUB_STEP_SUMMARY
          echo "Passed: ${PASS}/${#REQUIRED_IMAGES[@]}" >> $GITHUB_STEP_SUMMARY
          echo "Failed: ${FAIL}/${#REQUIRED_IMAGES[@]}" >> $GITHUB_STEP_SUMMARY

          if [ "${FAIL}" -ne 0 ]; then
            echo "::error::${FAIL} image(s) not found in GHCR"
            exit 1
          fi
          echo "All ${#REQUIRED_IMAGES[@]} required images verified in GHCR"

      - name: Trigger Infrastructure Deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_SECRET }}
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "Triggering infrastructure deploy-staging via workflow_dispatch..."
          gh workflow run deploy-staging.yml \
            --repo Gogidix-Road-assist/infrastructure \
            --ref staging/uat \
            -f terraform_action=apply || echo "::warning::Failed to trigger infrastructure terraform deploy"

          echo "Triggering Helm deploy of foundation-domain to EKS..."
          gh workflow run deploy-domain-to-eks.yml \
            --repo Gogidix-Road-assist/infrastructure \
            --ref main \
            -f domain=foundation-domain \
            -f environment=staging \
            -f image_tag="${SHORT_SHA}" || echo "::warning::Failed to trigger Helm deploy"
