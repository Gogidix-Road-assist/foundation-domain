when:
  - event: [push, pull_request]
    branch: [dev]

steps:
  build:
    image: maven:3.9-eclipse-temurin-21
    environment:
      MAVEN_OPTS: -Xmx1024m
    commands:
      - mkdir -p ~/.m2
      - echo "<settings xmlns='http://maven.apache.org/SETTINGS/1.0.0'><servers><server><id>github</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server><server><id>github-foundation</id><username>${GITHUB_ACTOR}</username><password>${PAT_SECRET}</password></server></servers></settings>" > ~/.m2/settings.xml
      - cd .
      - mvn install -DskipTests -N -q && mvn clean install -DskipTests -f shared-libraries/Backend/Java -q
      - mvn clean package -DskipTests -q 2>&1 | tail -20
      - echo "BUILD SUCCESS"

  test:
    image: maven:3.9-eclipse-temurin-21
    environment:
      MAVEN_OPTS: -Xmx1024m
    commands:
      - mkdir -p ~/.m2
      - echo "<settings xmlns='http://maven.apache.org/SETTINGS/1.0.0'><servers><server><id>github</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server><server><id>github-foundation</id><username>${GITHUB_ACTOR}</username><password>${PAT_SECRET}</password></server></servers></settings>" > ~/.m2/settings.xml
      - cd .
      - mvn install -DskipTests -N -q && mvn clean install -DskipTests -f shared-libraries/Backend/Java -q
      - mvn test 2>&1 | tail -30
    when:
      - event: push
        branch: [dev]

services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: test