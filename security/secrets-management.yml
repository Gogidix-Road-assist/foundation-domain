# Secrets Management Configuration
# Defines how secrets are managed across Foundation Domain services

# External Secrets Operator Configuration for Kubernetes
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: foundation-secret-store
  namespace: foundation-domain
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
# Database Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-secrets
  namespace: foundation-domain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: foundation-secret-store
    kind: SecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
  data:
    - secretKey: mongodb-uri
      remoteRef:
        key: foundation/domain/mongodb
        property: uri
    - secretKey: mongodb-username
      remoteRef:
        key: foundation/domain/mongodb
        property: username
    - secretKey: mongodb-password
      remoteRef:
        key: foundation/domain/mongodb
        property: password
    - secretKey: redis-password
      remoteRef:
        key: foundation/domain/redis
        property: password

---
# JWT and Encryption Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: security-secrets
  namespace: foundation-domain
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: foundation-secret-store
    kind: SecretStore
  target:
    name: security-credentials
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: foundation/domain/security
        property: jwt-secret
    - secretKey: jwt-expiration
      remoteRef:
        key: foundation/domain/security
        property: jwt-expiration
    - secretKey: encryption-key
      remoteRef:
        key: foundation/domain/security
        property: encryption-key
    - secretKey: api-key-hash
      remoteRef:
        key: foundation/domain/security
        property: api-key-hash

---
# Third-party API Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: integration-secrets
  namespace: foundation-domain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: foundation-secret-store
    kind: SecretStore
  target:
    name: integration-credentials
    creationPolicy: Owner
  data:
    - secretKey: stripe-api-key
      remoteRef:
        key: foundation/domain/integrations/stripe
        property: api-key
    - secretKey: sendgrid-api-key
      remoteRef:
        key: foundation/domain/integrations/sendgrid
        property: api-key
    - secretKey: twilio-account-sid
      remoteRef:
        key: foundation/domain/integrations/twilio
        property: account-sid
    - secretKey: twilio-auth-token
      remoteRef:
        key: foundation/domain/integrations/twilio
        property: auth-token
    - secretKey: google-maps-api-key
      remoteRef:
        key: foundation/domain/integrations/google
        property: maps-api-key
    - secretKey: openai-api-key
      remoteRef:
        key: foundation/domain/integrations/openai
        property: api-key

---
# Spring Boot Application Properties for Secrets
# Add this to application.yml

spring:
  config:
    import: optional:file:./secrets/
  cloud:
    kubernetes:
      secrets:
        enabled: true
        enableApi: true
        sources:
          - name: database-credentials
          - name: security-credentials
          - name: integration-credentials

# Alternative: HashiCorp Vault Configuration
spring.cloud.vault:
  uri: ${VAULT_URI:http://localhost:8200}
  token: ${VAULT_TOKEN}
  scheme: http
  kv:
    enabled: true
    backend: secret
    application-name: foundation-domain
  generic:
    enabled: true
    application-name: foundation-domain

---
# Secrets Rotation Policy

# Database credentials: Rotate every 90 days
secrets:
  rotation:
    database:
      enabled: true
      schedule: "0 0 1 */3 *"  # Every 90 days
      notification:
        - team: platform
          advance-notice: 7

# JWT secrets: Rotate every 30 days
secrets:
  rotation:
    jwt:
      enabled: true
      schedule: "0 0 1 * *"  # Monthly
      grace-period: 1h

# API keys: Rotate every 180 days
secrets:
  rotation:
    api-keys:
      enabled: true
      schedule: "0 0 1 */6 *"  # Every 6 months

# Encryption keys: Rotate annually
secrets:
  rotation:
    encryption:
      enabled: true
      schedule: "0 0 1 1 *"  # January 1st
      key-rotation: true

---
# Secrets Management Best Practices

# 1. Never commit secrets to git
# 2. Use .env.example for required environment variables (without values)
# 3. Use Kubernetes secrets with RBAC
# 4. Enable encryption at rest for secret stores
# 5. Use separate secrets per environment
# 6. Implement secret rotation policies
# 7. Audit secret access logs
# 8. Use principle of least privilege for secret access

