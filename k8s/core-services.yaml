spec:
  selector:
    app: service-registry
  ports:
  - port: 8761
    targetPort: 8761
  clusterIP: None

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiting-service
  namespace: foundation
  labels:
    app: rate-limiting-service
    domain: foundation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rate-limiting-service
  template:
    metadata:
      labels:
        app: rate-limiting-service
        domain: foundation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: rate-limiting-service
        image: ghcr.io/gogidix-road-assist-saas/rapid-assist/rate-limiting-service:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: foundation-config
              key: SPRING_PROFILES_ACTIVE
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: foundation-config
              key: REDIS_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: rate-limiting-service
  namespace: foundation
spec:
  selector:
    app: rate-limiting-service
  ports:
  - port: 8080
    targetPort: 8080
