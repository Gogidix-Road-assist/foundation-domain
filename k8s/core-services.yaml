# Foundation-Domain Core Services Deployment
# Image paths from: deploy/docker/docker-compose-ec2-1.yml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: foundation-config
  namespace: foundation
data:
  SPRING_PROFILES_ACTIVE: "kubernetes,kafka-disabled"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_USERNAME: "default"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  JAVA_OPTS: "-Xmx256m -Xms64m -XX:+UseG1GC"

---
apiVersion: v1
kind: Secret
metadata:
  name: foundation-secrets
  namespace: foundation
type: Opaque
stringData:
  MONGODB_URI: ""
  REDIS_HOST: ""
  REDIS_PORT: ""
  REDIS_PASSWORD: ""
  REDIS_USERNAME: ""
  SPRING_DATA_REDIS_PASSWORD: ""
  SPRING_KAFKA_BOOTSTRAP_SERVERS: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: foundation
  labels:
    app: service-registry
    domain: foundation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-registry
  template:
    metadata:
      labels:
        app: service-registry
        domain: foundation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8761"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: service-registry
        image: ghcr.io/gogidix-road-assist/foundation-domain/service-registry-discovery:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8761
          name: http
        envFrom:
        - configMapRef:
            name: foundation-config
        - secretRef:
            name: foundation-secrets
        env:
        - name: SERVER_PORT
          value: "8761"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: foundation
spec:
  selector:
    app: service-registry
  ports:
  - port: 8761
    targetPort: 8761
  clusterIP: None

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: foundation
  labels:
    app: api-gateway
    domain: foundation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        domain: foundation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8304"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/gogidix-road-assist/foundation-domain/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8304
          name: http
        envFrom:
        - configMapRef:
            name: foundation-config
        - secretRef:
            name: foundation-secrets
        env:
        - name: SERVER_PORT
          value: "8304"
        - name: GATEWAY_MONGODB_ENABLED
          value: "false"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8304
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8304
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: foundation
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - port: 8304
    targetPort: 8304

