apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-control-service
  namespace: foundation
  labels:
    app: access-control-service
    domain: foundation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: access-control-service
  template:
    metadata:
      labels:
        app: access-control-service
        domain: foundation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8311"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: access-control-service
        image: ghcr.io/gogidix-road-assist/foundation-domain/access-control-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8311
          name: http
        envFrom:
        - configMapRef:
            name: foundation-config
        - secretRef:
            name: foundation-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8311
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8311
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: access-control-service
  namespace: foundation
spec:
  selector:
    app: access-control-service
  ports:
  - port: 8311
    targetPort: 8311

