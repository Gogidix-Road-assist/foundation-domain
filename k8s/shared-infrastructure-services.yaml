kind: Service
metadata:
  name: integration-adapters-service
  namespace: foundation
spec:
  selector:
    app: integration-adapters-service
  ports:
  - port: 8320
    targetPort: 8320

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-aggregation-service
  namespace: foundation
  labels:
    app: logging-aggregation-service
    domain: foundation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-aggregation-service
  template:
    metadata:
      labels:
        app: logging-aggregation-service
        domain: foundation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8321"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: logging-aggregation-service
        image: ghcr.io/gogidix-road-assist/foundation-domain/logging-aggregation-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8321
          name: http
        envFrom:
        - configMapRef:
            name: foundation-config
        - secretRef:
            name: foundation-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8321
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8321
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: logging-aggregation-service
  namespace: foundation
spec:
  selector:
    app: logging-aggregation-service
  ports:
  - port: 8321
    targetPort: 8321

