# Foundation-Domain Infrastructure - ExternalName Services
# MongoDB Atlas + Upstash Redis
# Deploy AFTER setting MONGODB_ATLAS_HOST and REDIS_HOST in environment
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-atlas
  namespace: foundation
spec:
  type: ExternalName
  externalName: ${MONGODB_ATLAS_HOST}

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: foundation
spec:
  type: ExternalName
  externalName: ${REDIS_HOST}
