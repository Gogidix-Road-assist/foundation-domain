    alb.ingress.kubernetes.io/certificate-arn: ""
    alb.ingress.kubernetes.io/group.name: gogidix-platform
spec:
  ingressClassName: alb
  tls:
  - hosts:
    - grafana.gogidix.com
    secretName: grafana-tls
  rules:
