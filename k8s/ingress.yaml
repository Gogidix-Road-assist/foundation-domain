# Foundation-Domain Ingress Configuration
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foundation-ingress
  namespace: foundation
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - foundation.gogidix.com
    - api.gogidix.com
    - ai.gogidix.com
    secretName: foundation-tls
  rules:
  - host: foundation.gogidix.com
    http:
      paths:
      - path: /gateway(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8304
      - path: /identity(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: identity-service
            port:
              number: 8316
      - path: /notifications(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8323
      - path: /registry(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: service-registry
            port:
              number: 8761

  - host: api.gogidix.com
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8304

  - host: ai.gogidix.com
    http:
      paths:
      - path: /ai-gateway(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: ai-gateway
            port:
              number: 8200
      - path: /inference(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: ai-inference
            port:
              number: 8201
      - path: /chatbot(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: ai-chatbot
            port:
              number: 8214
      - path: /nlp(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: ai-nlp
            port:
              number: 8210

---
# Grafana Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: foundation
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - grafana.gogidix.com
    secretName: grafana-tls
  rules:
  - host: grafana.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000

---
# Prometheus Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: foundation
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: prometheus-auth
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - prometheus.gogidix.com
    secretName: prometheus-tls
  rules:
  - host: prometheus.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
