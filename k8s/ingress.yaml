# Foundation-Domain Ingress Configuration
# Uses AWS ALB Ingress Controller for EKS
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foundation-ingress
  namespace: foundation
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: ""
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "20"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/group.name: gogidix-platform
    alb.ingress.kubernetes.io/security-groups: ""
spec:
  ingressClassName: alb
  tls:
  - hosts:
    - api.gogidix.com
    - foundation.gogidix.com
    secretName: foundation-tls
  rules:
  - host: api.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8304

  - host: foundation.gogidix.com
    http:
      paths:
      - path: /gateway
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8304
      - path: /registry
        pathType: Prefix
        backend:
          service:
            name: service-registry
            port:
              number: 8761
      - path: /config
        pathType: Prefix
        backend:
          service:
            name: config-service
            port:
              number: 8888

---
