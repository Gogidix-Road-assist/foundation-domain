# Foundation-Domain AI Services Deployment
# NOTE: These are AI-Domain services deployed in foundation namespace
# for Eureka/registry proximity. Image paths from docker-compose-ec2-2.yml.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: foundation
  labels:
    app: ai-gateway
    domain: ai-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
        domain: ai-services
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: ai-gateway
        image: ghcr.io/gogidix-road-assist/ai-domain/ai-gateway-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: foundation-config
              key: SPRING_PROFILES_ACTIVE
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: foundation-secrets
              key: MONGODB_URI
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: foundation-config
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: foundation
spec:
  selector:
    app: ai-gateway
  ports:
  - port: 8080
    targetPort: 8080

