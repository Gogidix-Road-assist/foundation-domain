server:
  port: 8102

spring:
  application:
    name: dynamic-routing-config-service

  data:
    mongodb:
      uri: ${MONGODB_URI:}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:r-4xo326106227c264.redis.germany.rds.aliyuncs.com}
      port: 6379
      password: ${REDIS_PASSWORD:Gog1d1xPlatform2026}
      database: 4
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gogidix.rapidassist.dynamic.routing.config.service: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

routing:
  cache:
    ttl-minutes: 10
  default:
    timeout: 30000
    retry-attempts: 3
