server:
  port: 8100

spring:
  application:
    name: feature-flags-service

  data:
    mongodb:
      host: localhost
      port: 27017
      database: feature_flags_db
      auto-index-creation: true

  redis:
    host: localhost
    port: 6379
    database: 2
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gogidix.rapidassist.feature.flags.service: INFO
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

feature:
  flags:
    cache:
      ttl-minutes: 5
    evaluation:
      default-environment: production
