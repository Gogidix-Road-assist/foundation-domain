openapi: 3.0.3
info:
  title: Feature Flags Service API
  description: |
    Feature Flags Service for Rapid Assist platform.
    Provides API for managing feature flags with multi-tenancy support.
  version: 1.0.0
  contact:
    name: Gogidix
    email: support@gogidix.com

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://feature-flags.gogidix.com/api/v1
    description: Production server

tags:
  - name: Feature Flags
    description: Feature flag management operations
  - name: Health
    description: Health check endpoints

paths:
  /feature-flags:
    get:
      tags:
        - Feature Flags
      summary: List all feature flags
      operationId: listFeatureFlags
      parameters:
        - name: tenantId
          in: header
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: environment
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED]
      responses:
        '200':
          description: List of feature flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFeatureFlagsResponse'
    post:
      tags:
        - Feature Flags
      summary: Create a new feature flag
      operationId: createFeatureFlag
      parameters:
        - name: tenantId
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeatureFlagRequest'
      responses:
        '201':
          description: Feature flag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'

  /feature-flags/{id}:
    get:
      tags:
        - Feature Flags
      summary: Get a feature flag by ID
      operationId: getFeatureFlag
      parameters:
        - name: tenantId
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Feature flag details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '404':
          description: Feature flag not found
    put:
      tags:
        - Feature Flags
      summary: Update a feature flag
      operationId: updateFeatureFlag
      parameters:
        - name: tenantId
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureFlagRequest'
      responses:
        '200':
          description: Feature flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
    delete:
      tags:
        - Feature Flags
      summary: Delete a feature flag
      operationId: deleteFeatureFlag
      parameters:
        - name: tenantId
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Feature flag deleted

  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

components:
  schemas:
    FeatureFlagResponse:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        type:
          type: string
          enum: [BOOLEAN, MULTIVARIATE, KILL_SWITCH]
        rolloutStrategy:
          type: string
          enum: [ALL_USERS, SPECIFIC_TENANTS, SPECIFIC_USERS, PERCENTAGE, COUNTRY_BASED, GRADUAL]
        environment:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    CreateFeatureFlagRequest:
      type: object
      required:
        - key
        - name
        - type
        - rolloutStrategy
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [BOOLEAN, MULTIVARIATE, KILL_SWITCH]
        rolloutStrategy:
          type: string
          enum: [ALL_USERS, SPECIFIC_TENANTS, SPECIFIC_USERS, PERCENTAGE, COUNTRY_BASED, GRADUAL]
        environment:
          type: string
          default: production

    UpdateFeatureFlagRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        status:
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED]

    PagedFeatureFlagsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
