server:
  port: 8105

spring:
  application:
    name: release-rollout-config-service
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.gogidix.rapidassist.release.rollout.config.service: INFO

rollout:
  default:
    batch-size: 10
    batch-interval-minutes: 30
