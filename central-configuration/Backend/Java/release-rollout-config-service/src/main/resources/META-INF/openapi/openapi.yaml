openapi: 3.0.3
info:
  title: Release Rollout Configuration Service API
  description: |
    API for managing release rollout configurations with support for
    multiple deployment strategies (Blue-Green, Canary, Gradual, etc.)
  version: 1.0.0
  contact:
    name: Gogidix Rapid Assist
    email: support@gogidix.com

servers:
  - url: http://localhost:8082/api/v1
    description: Development server
  - url: https://api.gogidix.com/rollout/api/v1
    description: Production server

tags:
  - name: rollouts
    description: Release rollout operations
  - name: health
    description: Health check operations

paths:
  /rollouts:
    get:
      tags:
        - rollouts
      summary: List all rollouts
      operationId: listRollouts
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
        - name: releaseId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RolloutStatus'
        - name: strategy
          in: query
          schema:
            $ref: '#/components/schemas/RolloutStrategy'
        - name: environment
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRolloutResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - rollouts
      summary: Create a new rollout
      operationId: createRollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRolloutRequest'
      responses:
        '201':
          description: Rollout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rollouts/{id}:
    get:
      tags:
        - rollouts
      summary: Get a rollout by ID
      operationId: getRollout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
        '404':
          description: Rollout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - rollouts
      summary: Update rollout status
      operationId: updateRolloutStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolloutRequest'
      responses:
        '200':
          description: Rollout updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - rollouts
      summary: Delete a rollout
      operationId: deleteRollout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Rollout deleted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags:
        - health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

components:
  schemas:
    RolloutResponse:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        releaseId:
          type: string
        version:
          type: string
        strategy:
          $ref: '#/components/schemas/RolloutStrategy'
        config:
          $ref: '#/components/schemas/RolloutConfig'
        status:
          $ref: '#/components/schemas/RolloutStatus'
        environment:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        recordVersion:
          type: integer

    RolloutConfig:
      type: object
      properties:
        batchSize:
          type: integer
        batchIntervalMinutes:
          type: integer
        initialPercentage:
          type: integer
        maxPercentage:
          type: integer
        targetSegments:
          type: array
          items:
            type: string
        criteria:
          type: string
        autoPromote:
          type: boolean
        requireApproval:
          type: boolean

    RolloutStrategy:
      type: string
      enum:
        - BLUE_GREEN
        - CANARY
        - GRADUAL
        - BIG_BANG
        - AB_TESTING

    RolloutStatus:
      type: string
      enum:
        - PLANNED
        - IN_PROGRESS
        - PAUSED
        - COMPLETED
        - ROLLED_BACK
        - FAILED

    CreateRolloutRequest:
      type: object
      required:
        - tenantId
        - releaseId
        - version
        - strategy
        - environment
        - createdBy
      properties:
        tenantId:
          type: string
        releaseId:
          type: string
        version:
          type: string
        strategy:
          $ref: '#/components/schemas/RolloutStrategy'
        config:
          $ref: '#/components/schemas/RolloutConfig'
        environment:
          type: string
        createdBy:
          type: string
        reason:
          type: string

    UpdateRolloutRequest:
      type: object
      required:
        - newStatus
        - updatedBy
      properties:
        newStatus:
          $ref: '#/components/schemas/RolloutStatus'
        updatedBy:
          type: string
        reason:
          type: string

    PagedRolloutResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RolloutResponse'
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
