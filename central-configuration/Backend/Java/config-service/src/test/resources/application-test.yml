server:
  port: 8080

spring:
  application:
    name: config-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  data:
    mongodb:
      uri: mongodb://localhost:27017/test_config_service
      auto-index-creation: true

  # Disable Redis for smoke tests since it's not installed
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:

# Use NoOp cache since Redis is not installed
gogidix:
  config:
    cache:
      provider: noop
      ttl: PT30M

app:
  security:
    cors:
      allowed-origins: http://localhost:3000,http://localhost:8080
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
    users:
      admin:
        username: admin
        password: admin123
      reader:
        username: reader
        password: reader123
      approver:
        username: approver
        password: approver123

# Enable actuator endpoints for tests
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true

logging:
  level:
    com.gogidix.rapidassist.config: DEBUG
    org.springframework.security: DEBUG
