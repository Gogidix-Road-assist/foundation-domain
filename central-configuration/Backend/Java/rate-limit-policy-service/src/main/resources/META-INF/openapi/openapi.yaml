openapi: 3.0.3
info:
  title: Rate Limit Policy Service API
  description: |
    Rate Limit Policy Service for managing API rate limiting policies in a multi-tenant SaaS environment.

    This service provides CRUD operations for rate limit policies with tenant isolation.
  version: 1.0.0
  contact:
    name: Gogidix Support
    email: support@gogidix.com
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.gogidix.com/rate-limit/v1
    description: Production server

tags:
  - name: Rate Limit Policies
    description: Rate limit policy management operations
  - name: Health
    description: Health check operations

paths:
  /rate-limit-policies:
    get:
      tags:
        - Rate Limit Policies
      summary: List rate limit policies
      description: Retrieve a paginated list of rate limit policies for a tenant
      operationId: listRateLimitPolicies
      parameters:
        - name: tenantId
          in: header
          required: true
          description: Tenant ID for multi-tenancy isolation
          schema:
            type: string
        - name: page
          in: query
          description: Page number (0-based)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Page size
          schema:
            type: integer
            default: 20
        - name: environment
          in: query
          description: Filter by environment
          schema:
            type: string
        - name: enabled
          in: query
          description: Filter by enabled status
          schema:
            type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRateLimitPolicyResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

    post:
      tags:
        - Rate Limit Policies
      summary: Create rate limit policy
      description: Create a new rate limit policy
      operationId: createRateLimitPolicy
      parameters:
        - name: tenantId
          in: header
          required: true
          description: Tenant ID for multi-tenancy isolation
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRateLimitPolicyRequest'
      responses:
        '201':
          description: Policy created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitPolicyResponse'
        '400':
          description: Bad request
        '409':
          description: Policy already exists

  /rate-limit-policies/{policyId}:
    get:
      tags:
        - Rate Limit Policies
      summary: Get rate limit policy
      description: Retrieve a specific rate limit policy by ID
      operationId: getRateLimitPolicy
      parameters:
        - name: policyId
          in: path
          required: true
          description: Policy ID
          schema:
            type: string
        - name: tenantId
          in: header
          required: true
          description: Tenant ID for multi-tenancy isolation
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitPolicyResponse'
        '404':
          description: Policy not found

    put:
      tags:
        - Rate Limit Policies
      summary: Update rate limit policy
      description: Update an existing rate limit policy
      operationId: updateRateLimitPolicy
      parameters:
        - name: policyId
          in: path
          required: true
          description: Policy ID
          schema:
            type: string
        - name: tenantId
          in: header
          required: true
          description: Tenant ID for multi-tenancy isolation
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRateLimitPolicyRequest'
      responses:
        '200':
          description: Policy updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitPolicyResponse'
        '400':
          description: Bad request
        '404':
          description: Policy not found

    delete:
      tags:
        - Rate Limit Policies
      summary: Delete rate limit policy
      description: Delete a rate limit policy
      operationId: deleteRateLimitPolicy
      parameters:
        - name: policyId
          in: path
          required: true
          description: Policy ID
          schema:
            type: string
        - name: tenantId
          in: header
          required: true
          description: Tenant ID for multi-tenancy isolation
          schema:
            type: string
      responses:
        '204':
          description: Policy deleted successfully
        '404':
          description: Policy not found

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check service health status
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

components:
  schemas:
    RateLimitPolicyResponse:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        policyKey:
          type: string
        name:
          type: string
        description:
          type: string
        limitType:
          type: string
          enum: [IP_BASED, USER_BASED, API_KEY_BASED, TENANT_BASED, GLOBAL]
        config:
          $ref: '#/components/schemas/RateLimitConfig'
        scope:
          $ref: '#/components/schemas/PolicyScope'
        enabled:
          type: boolean
        environment:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagedRateLimitPolicyResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RateLimitPolicyResponse'
        currentPage:
          type: integer
        pageSize:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    CreateRateLimitPolicyRequest:
      type: object
      required:
        - policyKey
        - name
        - limitType
        - environment
      properties:
        policyKey:
          type: string
        name:
          type: string
        description:
          type: string
        limitType:
          type: string
          enum: [IP_BASED, USER_BASED, API_KEY_BASED, TENANT_BASED, GLOBAL]
        config:
          $ref: '#/components/schemas/RateLimitConfig'
        scope:
          $ref: '#/components/schemas/PolicyScope'
        enabled:
          type: boolean
          default: true
        environment:
          type: string

    UpdateRateLimitPolicyRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        config:
          $ref: '#/components/schemas/RateLimitConfig'
        scope:
          $ref: '#/components/schemas/PolicyScope'

    RateLimitConfig:
      type: object
      properties:
        requestsPerMinute:
          type: integer
        requestsPerHour:
          type: integer
        requestsPerDay:
          type: integer
        burstCapacity:
          type: integer
        windowSizeMs:
          type: integer
        algorithm:
          type: string

    PolicyScope:
      type: object
      properties:
        endpoints:
          type: array
          items:
            type: string
        userIds:
          type: array
          items:
            type: string
        apiKeys:
          type: array
          items:
            type: string
        attributes:
          type: object

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - BearerAuth: []
  - ApiKeyAuth: []
