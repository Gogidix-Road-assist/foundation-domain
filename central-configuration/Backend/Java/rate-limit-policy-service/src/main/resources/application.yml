server:
  port: 8104

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  application:
    name: rate-limit-policy-service
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 6

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.gogidix.rapidassist.rate.limit.policy.service: INFO

rate-limit:
  default:
    requests-per-minute: 60
  cache:
    ttl-seconds: 60
