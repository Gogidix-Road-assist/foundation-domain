# MongoDB Configuration for Foundation-Domain Orchestration Services
# Rapid Assist Platform - Production Ready

# ========================================
# MongoDB Connection Configuration
# ========================================
spring.data.mongodb.uri=mongodb://localhost:27017

# Database Name (service-specific)
spring.data.mongodb.database=${SERVICE_NAME}

# MongoDB Connection Pooling
spring.data.mongodb.client.min-connections-per-host=10
spring.data.mongodb.client.max-connections-per-host=100
spring.data.mongodb.client.max-connection-idle-time=60000
spring.data.mongodb.client.max-connection-life-time=120000
spring.data.mongodb.client.connect-timeout=10000
spring.data.mongodb.client.socket-timeout=60000
spring.data.mongodb.client.server-selection-timeout=30000

# ========================================
# Service-Specific Database Names
# ========================================
# Alerting Service: rapid_assist_alerting_service
# Dispatching Service: rapid_assist_dispatching_service
# Fleet Assistance Service: rapid_assist_fleet_assistance_service
# Fleet Organization Service: rapid_assist_fleet_organization_service
# Fleet Policy Service: rapid_assist_fleet_policy_service
# Fleet Vehicles Service: rapid_assist_fleet_vehicles_service
# Location Service: rapid_assist_location_service
# Matching Service: rapid_assist_matching_service
# Monitoring Service: rapid_assist_monitoring_service
# Reporting Service: rapid_assist_reporting_service
# Transaction Orchestration Service: rapid_assist_transaction_orchestration_service

# ========================================
# MongoDB Indexing Configuration
# ========================================
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.auto-creation-indices=true

# ========================================
# Multi-Tenancy Configuration
# =================================-------
# Tenant isolation handled at application layer
# All collections include tenantId field for data isolation
# Indexes created on tenantId for query optimization

# ========================================
# Geospatial Configuration
# ========================================
# Location-based services use 2dsphere indexes
# Coordinates stored in GeoJSON format
# Query radius configured per service requirements

# ========================================
# Monitoring and Health Checks
# ========================================
management.health.mongo.enabled=true
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# ========================================
# Logging Configuration
# ========================================
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.mongodb.repository.Query=DEBUG

# ========================================
# Performance Tuning
# ========================================
spring.data.mongodb.client.max-connection-per-host=100
spring.data.mongodb.client.threads-allowed-to-block-for-connection-multiplier=5
spring.data.mongodb.client.write-concern=MAJORITY
spring.data.mongodb.client.read-concern=MAJORITY

# ========================================
# Transaction Configuration
# ========================================
spring.data.mongodb.transaction.enabled=true
spring.transaction.default-timeout=30

# ========================================
# Caching Configuration
# ========================================
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=300000

# ========================================
# Service Discovery (Eureka)
# ========================================
spring.cloud.compatibility-verifier.enabled=false
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ========================================
# Kafka Configuration
# ========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ========================================
# Actuator Configuration
# ========================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ========================================
# Application Configuration
# ========================================
spring.application.name=${SERVICE_NAME}
server.port=${SERVICE_PORT:8080}
server.servlet.context-path=/

# ========================================
# OpenAPI/Swagger Configuration
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true

# ========================================
# Validation Configuration
# ========================================
spring.validation.enabled=true
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# ========================================
# Locale and Timezone
# ========================================
spring.mvc.locale=en_US
spring.mvc.time-zone=UTC

# ========================================
# Error Handling
# ========================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
