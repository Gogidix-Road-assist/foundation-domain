name: Deploy Dispatching Service

on:
  push:
    branches:
      - main
    paths:
      - 'orchestration-services/Backend/Java/dispatching-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build package
        run: |
          cd orchestration-services/Backend/Java/dispatching-service
          mvn clean package -DskipTests -B

      - name: Build Docker image
        run: |
          cd orchestration-services/Backend/Java/dispatching-service
          docker build -t dispatching-service:${{ github.sha }} .
          docker tag dispatching-service:${{ github.sha }} dispatching-service:latest

      - name: Run smoke tests
        run: |
          docker run -d --name dispatching-test -p 8084:8084 dispatching-service:latest
          sleep 30
          curl -f http://localhost:8084/actuator/health || exit 1
          docker stop dispatching-test
          docker rm dispatching-test
