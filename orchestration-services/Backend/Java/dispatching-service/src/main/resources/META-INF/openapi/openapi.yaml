openapi: 3.0.3
info:
  title: Dispatching Service API
  description: API for managing roadside assistance dispatch operations
  version: 1.0.0
  contact:
    name: Gogidix RapidAssist Team
    email: support@gogidix.com

servers:
  - url: http://localhost:8084/api/v1
    description: Local development server
  - url: https://dispatching-service.gogidix.com/api/v1
    description: Production server

security:
  - bearerAuth: []

tags:
  - name: Dispatches
    description: Dispatch management operations
  - name: Providers
    description: Service provider operations
  - name: Health
    description: Health check operations

paths:
  /dispatches:
    post:
      tags:
        - Dispatches
      summary: Create a new dispatch
      operationId: createDispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDispatchRequest'
      responses:
        '201':
          description: Dispatch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Dispatches
      summary: List all dispatches for current tenant
      operationId: listDispatches
      parameters:
        - name: requestId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED, FAILED, ON_HOLD]
      responses:
        '200':
          description: List of dispatches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DispatchResponse'

  /dispatches/{dispatchId}:
    get:
      tags:
        - Dispatches
      summary: Get dispatch by ID
      operationId: getDispatch
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dispatch found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'
        '404':
          description: Dispatch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dispatches/{dispatchId}/status:
    put:
      tags:
        - Dispatches
      summary: Update dispatch status
      operationId: updateDispatchStatus
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDispatchStatusRequest'
      responses:
        '200':
          description: Dispatch status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'

  /dispatches/{dispatchId}/assignments:
    post:
      tags:
        - Dispatches
      summary: Assign provider to dispatch
      operationId: assignProvider
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignProviderRequest'
      responses:
        '201':
          description: Provider assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'

  /providers/available:
    get:
      tags:
        - Providers
      summary: Get available providers
      operationId: getAvailableProviders
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of available providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderInfo'

  /actuator/health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateDispatchRequest:
      type: object
      required:
        - requestId
        - serviceType
        - priority
        - location
      properties:
        requestId:
          type: string
        serviceType:
          type: string
          enum: [TOWING, FLATBED, JUMP_START, FUEL_DELIVERY, TIRE_CHANGE, LOCKOUT]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, EMERGENCY]
        location:
          $ref: '#/components/schemas/Location'

    UpdateDispatchStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED, FAILED, ON_HOLD]
        performedBy:
          type: string
        notes:
          type: string
        actualArrival:
          type: string
          format: date-time
        completionTime:
          type: string
          format: date-time

    AssignProviderRequest:
      type: object
      required:
        - providerId
        - assignmentScore
      properties:
        providerId:
          type: string
        vehicleId:
          type: string
        driverId:
          type: string
        assignmentScore:
          type: number
          format: double
        estimatedDistance:
          type: number
          format: double
        estimatedDuration:
          type: integer

    DispatchResponse:
      type: object
      properties:
        dispatchId:
          type: string
        requestId:
          type: string
        tenantId:
          type: string
        serviceType:
          type: string
        status:
          type: string
          enum: [PENDING, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED, FAILED, ON_HOLD]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, EMERGENCY]
        location:
          $ref: '#/components/schemas/Location'
        assignedProviderId:
          type: string
        assignedVehicleId:
          type: string
        estimatedArrival:
          type: string
          format: date-time
        actualArrival:
          type: string
          format: date-time
        completionTime:
          type: string
          format: date-time
        assignmentMethod:
          type: string
          enum: [AUTOMATIC, MANUAL, ALERTING]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssignmentResponse:
      type: object
      properties:
        assignmentId:
          type: string
        dispatchId:
          type: string
        providerId:
          type: string
        vehicleId:
          type: string
        driverId:
          type: string
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, CANCELLED, IN_TRANSIT, ON_SCENE, COMPLETED]
        assignedAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        assignmentScore:
          type: number
          format: double
        estimatedDistance:
          type: number
          format: double
        estimatedDuration:
          type: integer

    ProviderInfo:
      type: object
      properties:
        providerId:
          type: string
        userId:
          type: string
        organizationId:
          type: string
        currentStatus:
          type: string
          enum: [AVAILABLE, BUSY, OFFLINE, ON_BREAK, UNAVAILABLE]
        currentLoad:
          type: integer
        maxConcurrentJobs:
          type: integer
        averageRating:
          type: number
          format: double
        serviceTypes:
          type: array
          items:
            type: string

    Location:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        correlationId:
          type: string
        tenantId:
          type: string
        validationErrors:
          type: object
          additionalProperties:
            type: string
