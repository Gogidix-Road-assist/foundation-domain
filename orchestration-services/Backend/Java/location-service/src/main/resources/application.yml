spring:
  application:
    name: location-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/orchestration_location_service_db?authSource=admin
      auto-index-creation: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: location-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8089
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.gogidix.rapidassist: DEBUG
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

location:
  service:
    max-concurrent-requests: 100
    default-timeout-seconds: 300

# Geospatial configuration
geospatial:
  earth-radius: 6371000  # meters
  default-radius: 1000    # meters
  max-radius: 50000       # meters (50km)

# Route calculation
routing:
  default-provider: osrm
  cache-ttl-minutes: 60
  request-timeout-ms: 5000

# Alert configuration
alerts:
  retention-days: 30
  send-interval-minutes: 1
  default-severity: MEDIUM

# Location history retention
history:
  retention-days: 90
  cleanup-cron: "0 0 2 * * ?"  # 2 AM daily

# Route cleanup
routes:
  retention-days: 7
  cleanup-cron: "0 0 3 * * ?"  # 3 AM daily

kafka:
  topics:
    location-updated: location-updated
    bulk-locations-updated: bulk-locations-updated
    geofence-created: geofence-created
    geofence-updated: geofence-updated
    geofence-deleted: geofence-deleted
    alert-created: alert-created
    alert-acknowledged: alert-acknowledged
    alert-resolved: alert-resolved
    alert-sent: alert-sent
    route-calculated: route-calculated
