spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  application:
    name: monitoring-service

  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:monitoring_service}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USERNAME:}
      database: 11
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  # Kafka is REQUIRED for monitoring events
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:}
    properties:
      # Retry configuration for robustness
      retries: 3
      retry.backoff.ms: 1000
      # Connection timeout
      request.timeout.ms: 5000
      # Session timeout
      session.timeout.ms: 10000
      # Heartbeat interval
      heartbeat.interval.ms: 3000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      # Delivery timeout
      delivery.timeout.ms: 10000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: monitoring-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        # Session timeout
        session.timeout.ms: 10000
        # Heartbeat interval
        heartbeat.interval.ms: 3000

server:
  port: 8091
  shutdown: graceful

management:
  health:
    redis:
      enabled: false
  health:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    # MongoDB is required for metrics storage
    mongo:
      enabled: true
    kafka:
      enabled: false

logging:
  level:
    com.gogidix.rapidassist: INFO
    org.springframework.data.mongodb: WARN
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

monitoring:
  service:
    max-concurrent-requests: 100
    default-timeout-seconds: 300