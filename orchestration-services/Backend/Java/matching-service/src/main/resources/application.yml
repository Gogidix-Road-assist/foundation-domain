spring:
  application:
    name: matching-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/orchestration_matching_service_db?authSource=admin
      auto-index-creation: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: matching-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8090
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.gogidix.rapidassist: DEBUG
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

matching:
  algorithms:
    enabled:
      - NEAREST
      - BEST_FIT
      - LEAST_COST
      - PRIORITY_BASED
  scoring:
    distance-weight: 0.3
    capability-weight: 0.3
    availability-weight: 0.2
    rating-weight: 0.2
  geospatial:
    default-radius-km: 50
    max-radius-km: 200
  cache:
    provider-ttl-minutes: 30
    result-ttl-minutes: 15
  service:
    max-concurrent-requests: 100
    default-timeout-seconds: 300
