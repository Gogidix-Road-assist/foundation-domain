spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/test_country_aggregation_service}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    kafka:
      enabled: false
    redis:
      enabled: false
