###############################################################################
# Micrometer Configuration - AI Fraud Detection Service
# Financial-Grade Testing Standard - Phase 4
#
# This file defines metrics collection configuration for observability.
# Uses Micrometer for application metrics with Prometheus format.
###############################################################################

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      logback: true
      application: true
      kafka: true
      mongo: true
    export:
      prometheus:
        enabled: true
        step: 30s
        descriptions: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        fraud.detection.duration: true
        ai.model.inference.duration: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
        fraud.detection.duration: 0.5, 0.75, 0.95, 0.99
        ai.model.inference.duration: 0.5, 0.75, 0.95, 0.99
      slo:
        http.server.requests: 100ms, 250ms, 500ms, 1000ms
        fraud.detection.duration: 50ms, 100ms, 200ms, 500ms
        ai.model.inference.duration: 25ms, 50ms, 100ms, 200ms
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
      region: ${REGION:default}
      instance_id: ${INSTANCE_ID:${random.value}}

###############################################################################
# Custom Metrics Configuration
###############################################################################

metrics.custom:
  # Fraud Detection Metrics
  fraud.detection:
    - name: fraud_detections_total
      type: counter
      description: Total number of fraud detections performed
      labels:
        - tenant_id
        - entity_type
        - risk_level
        - detection_method

    - name: fraud_detection_duration
      type: distribution
      description: Fraud detection operation duration
      unit: milliseconds
      labels:
        - tenant_id
        - detection_method

    - name: fraud_score_distribution
      type: distribution
      description: Distribution of fraud scores
      labels:
        - tenant_id
        - entity_type
        - model_version

  # AI Model Metrics
  ai.model:
    - name: ai_model_inference_duration
      type: distribution
      description: AI model inference duration
      unit: milliseconds
      labels:
        - model_name
        - model_version

    - name: ai_model_prediction_total
      type: counter
      description: Total number of AI predictions
      labels:
        - model_name
        - model_version
        - prediction_class

    - name: ai_model_drift_score
      type: gauge
      description: Model drift score (KL divergence)
      labels:
        - model_name
        - model_version

    - name: ai_model_feature_importance
      type: gauge
      description: Feature importance scores
      labels:
        - model_name
        - feature_name

  # Alert Metrics
  fraud.alerts:
    - name: fraud_alerts_created_total
      type: counter
      description: Total number of fraud alerts created
      labels:
        - tenant_id
        - alert_type
        - escalation_level

    - name: fraud_alerts_escalated_total
      type: counter
      description: Total number of fraud alerts escalated
      labels:
        - tenant_id
        - from_level
        - to_level

  # Case Metrics
  fraud.cases:
    - name: fraud_cases_created_total
      type: counter
      description: Total number of fraud cases created
      labels:
        - tenant_id
        - case_type

    - name: fraud_case_duration
      type: distribution
      description: Time to resolve fraud cases
      unit: milliseconds
      labels:
        - tenant_id
        - case_status

  # Multi-Tenancy Metrics
  tenant.isolation:
    - name: tenant_operations_total
      type: counter
      description: Total operations by tenant
      labels:
        - tenant_id
        - operation_type
        - status

    - name: tenant_cross_access_attempts_total
      type: counter
      description: Cross-tenant access attempts
      labels:
        - source_tenant
        - target_tenant
        - access_result

  # Database Metrics
  database.operations:
    - name: db_query_duration
      type: distribution
      description: Database query duration
      unit: milliseconds
      labels:
        - operation_type
        - collection_name

    - name: db_connection_pool_active
      type: gauge
      description: Active database connections

    - name: db_connection_pool_idle
      type: gauge
      description: Idle database connections

  # Kafka Event Metrics
  kafka.events:
    - name: kafka_events_published_total
      type: counter
      description: Total Kafka events published
      labels:
        - event_type
        - topic
        - status

    - name: kafka_events_publish_duration
      type: distribution
      description: Kafka event publish duration
      unit: milliseconds
      labels:
        - event_type
        - topic

    - name: kafka_consumer_lag
      type: gauge
      description: Kafka consumer lag
      labels:
        - topic
        - consumer_group
        - partition

  # Cache Metrics (if caching is used)
  cache:
    - name: cache_hits_total
      type: counter
      description: Cache hits
      labels:
        - cache_name

    - name: cache_misses_total
      type: counter
      description: Cache misses
      labels:
        - cache_name

    - name: cache_evictions_total
      type: counter
      description: Cache evictions
      labels:
        - cache_name

###############################################################################
# Metrics Filters
###############################################################################

metrics.exclude:
  # Exclude verbose JVM metrics
  - jvm.buffer.count
  - jvm.buffer.memory.used
  - jvm.classes.loaded
  - jvm.memory.committed
  - jvm.memory.max
  - tomcat.sessions.active.current

metrics.include:
  # Include key business metrics
  - fraud.*
  - ai.*
  - tenant.*
  - kafka.events.*

###############################################################################
# Prometheus Scrape Configuration
###############################################################################

prometheus:
  scrape:
    interval: 30s
    timeout: 10s
  metrics_path: /actuator/prometheus
  labels:
    service: ai-fraud-detection-service
    team: platform
