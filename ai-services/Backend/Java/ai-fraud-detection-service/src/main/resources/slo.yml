###############################################################################
# SLO Definitions - AI Fraud Detection Service
# Financial-Grade Testing Standard - Phase 4
#
# This file defines Service Level Objectives (SLOs) for the fraud detection service.
# These SLOs are used for monitoring, alerting, and canary deployment validation.
#
# SLO Format:
#   - name: Unique SLO identifier
#   - target: Target value (percentage or duration)
#   - window: Measurement window
#   - alert_threshold: Alert if below this value
#   - action_threshold: Critical action if below this value
###############################################################################

service:
  name: ai-fraud-detection-service
  version: 1.0.0
  environment: production
  owner: platform-team@gogidix.com

###############################################################################
# AVAILABILITY SLOs
###############################################################################

availability:
  # Overall service availability
  - name: overall_availability
    display_name: Overall Service Availability
    description: Percentage of time the service is healthy and responding
    target: 0.995
    window: 30d
    alert_threshold: 0.990
    action_threshold: 0.980
    measurement:
      type: success_rate
      total: http.server.requests
      success: http.server.requests{status!~"5.."}
    tags:
      - critical
      - financial-grade

  # API endpoint availability
  - name: api_availability
    display_name: API Endpoint Availability
    description: Percentage of successful API requests
    target: 0.995
    window: 7d
    alert_threshold: 0.990
    action_threshold: 0.975
    measurement:
      type: success_rate
      total: api.requests.total
      success: api.requests.success
    tags:
      - api
      - critical

###############################################################################
# LATENCY SLOs
###############################################################################

latency:
  # P95 latency for fraud detection
  - name: fraud_detection_p95_latency
    display_name: Fraud Detection P95 Latency
    description: 95th percentile latency for fraud detection requests
    target: 500ms
    window: 24h
    alert_threshold: 750ms
    action_threshold: 1000ms
    measurement:
      type: percentile
      percentile: 95
      metric: http.server.requests.duration
      endpoint: /api/v1/fraud-detection/detect
    tags:
      - latency
      - critical

  # P99 latency for fraud detection
  - name: fraud_detection_p99_latency
    display_name: Fraud Detection P99 Latency
    description: 99th percentile latency for fraud detection requests
    target: 1000ms
    window: 24h
    alert_threshold: 1500ms
    action_threshold: 2000ms
    measurement:
      type: percentile
      percentile: 99
      metric: http.server.requests.duration
      endpoint: /api/v1/fraud-detection/detect
    tags:
      - latency
      - critical

  # Batch processing latency
  - name: batch_processing_p95_latency
    display_name: Batch Processing P95 Latency
    description: 95th percentile latency for batch fraud detection
    target: 5000ms
    window: 1h
    alert_threshold: 7500ms
    action_threshold: 10000ms
    measurement:
      type: percentile
      percentile: 95
      metric: http.server.requests.duration
      endpoint: /api/v1/fraud-detection/batch
    tags:
      - latency
      - batch

###############################################################################
# FRAUD SCORING SLOs
###############################################################################

fraud_scoring:
  # Fraud scoring timeout
  - name: fraud_scoring_timeout
    display_name: Fraud Scoring Timeout Rate
    description: Percentage of fraud scoring operations that timeout
    target: 0.001  # 0.1%
    window: 24h
    alert_threshold: 0.005
    action_threshold: 0.010
    measurement:
      type: error_rate
      total: fraud.scoring.attempts
      errors: fraud.scoring.timeouts
    tags:
      - critical
      - ml

  # AI model response time
  - name: ai_model_response_time
    display_name: AI Model Response Time
    description: Average time for AI model inference
    target: 200ms
    window: 1h
    alert_threshold: 300ms
    action_threshold: 500ms
    measurement:
      type: average
      metric: ai.model.inference.duration
    tags:
      - ml
      - performance

  # Fraud score precision
  - name: fraud_score_precision
    display_name: Fraud Score Precision
    description: Consistency of fraud scores for similar inputs
    target: 0.95
    window: 7d
    alert_threshold: 0.90
    action_threshold: 0.85
    measurement:
      type: custom
      metric: fraud.score.precision
    tags:
      - ml
      - quality

###############################################################################
# ERROR RATE SLOs
###############################################################################

error_rate:
  # Overall error rate
  - name: overall_error_rate
    display_name: Overall Error Rate
    description: Percentage of requests resulting in 5xx errors
    target: 0.005  # 0.5%
    window: 24h
    alert_threshold: 0.010
    action_threshold: 0.020
    measurement:
      type: error_rate
      total: http.server.requests
      errors: http.server.requests{status=~"5.."}
    tags:
      - critical
      - reliability

  # Client error rate (4xx)
  - name: client_error_rate
    display_name: Client Error Rate
    description: Percentage of requests resulting in 4xx errors
    target: 0.050  # 5%
    window: 24h
    alert_threshold: 0.100
    action_threshold: 0.150
    measurement:
      type: error_rate
      total: http.server.requests
      errors: http.server.requests{status=~"4.."}
    tags:
      - reliability

  # Database error rate
  - name: database_error_rate
    display_name: Database Error Rate
    description: Percentage of database operations failing
    target: 0.001
    window: 1h
    alert_threshold: 0.005
    action_threshold: 0.010
    measurement:
      type: error_rate
      total: database.operations.total
      errors: database.operations.errors
    tags:
      - database
      - critical

###############################################################################
# THROUGHPUT SLOs
###############################################################################

throughput:
  # Requests per second
  - name: requests_per_second
    display_name: Requests Per Second
    description: Average request throughput
    target: 1000
    window: 5m
    alert_threshold: 500
    action_threshold: 200
    measurement:
      type: rate
      metric: http.server.requests
      unit: rps
    tags:
      - capacity

  # Fraud detections per second
  - name: fraud_detections_per_second
    display_name: Fraud Detections Per Second
    description: Fraud detection throughput
    target: 500
    window: 5m
    alert_threshold: 250
    action_threshold: 100
    measurement:
      type: rate
      metric: fraud.detections.total
      unit: rps
    tags:
      - capacity
      - business

###############################################################################
# MULTI-TENANCY SLOs
###############################################################################

multitenancy:
  # Tenant isolation compliance
  - name: tenant_isolation_compliance
    display_name: Tenant Isolation Compliance
    description: Percentage of operations maintaining proper tenant isolation
    target: 1.0  # 100%
    window: 30d
    alert_threshold: 0.999
    action_threshold: 0.995
    measurement:
      type: success_rate
      total: tenant.operations.total
      success: tenant.operations.isolated
    tags:
      - critical
      - security

  # Cross-tenant data leak rate
  - name: cross_tenant_leak_rate
    display_name: Cross-Tenant Data Leak Rate
    description: Percentage of operations leaking data across tenants
    target: 0.0  # 0% - zero tolerance
    window: 30d
    alert_threshold: 0.0
    action_threshold: 0.001
    measurement:
      type: error_rate
      total: tenant.data.access.total
      errors: tenant.data.access.cross_tenant
    tags:
      - critical
      - security
      - zero-tolerance

###############################################################################
# KAFKA EVENT SLOs
###############################################################################

kafka_events:
  # Event publishing success rate
  - name: event_publish_success_rate
    display_name: Event Publish Success Rate
    description: Percentage of Kafka events successfully published
    target: 0.995
    window: 24h
    alert_threshold: 0.990
    action_threshold: 0.980
    measurement:
      type: success_rate
      total: kafka.events.publish.attempts
      success: kafka.events.publish.success
    tags:
      - kafka
      - reliability

  # Event publishing latency
  - name: event_publish_p95_latency
    display_name: Event Publish P95 Latency
    description: 95th percentile latency for event publishing
    target: 100ms
    window: 1h
    alert_threshold: 200ms
    action_threshold: 500ms
    measurement:
      type: percentile
      percentile: 95
      metric: kafka.events.publish.duration
    tags:
      - kafka
      - latency

###############################################################################
# AI MODEL MONITORING SLOs
###############################################################################

ai_monitoring:
  # Model prediction consistency
  - name: prediction_consistency
    display_name: Model Prediction Consistency
    description: Percentage of identical inputs producing identical outputs
    target: 0.98
    window: 7d
    alert_threshold: 0.95
    action_threshold: 0.90
    measurement:
      type: custom
      metric: ai.model.consistency.score
    tags:
      - ml
      - drift

  # Model drift detection
  - name: model_drift_score
    display_name: Model Drift Score
    description: Statistical measure of model output drift
    target: 0.1
    window: 24h
    alert_threshold: 0.2
    action_threshold: 0.3
    measurement:
      type: custom
      metric: ai.model.drift.kl_divergence
    tags:
      - ml
      - drift

  # Feature distribution stability
  - name: feature_distribution_stability
    display_name: Feature Distribution Stability
    description: Population stability index for input features
    target: 0.1
    window: 7d
    alert_threshold: 0.2
    action_threshold: 0.25
    measurement:
      type: custom
      metric: ai.features.psi
    tags:
      - ml
      - drift

###############################################################################
# RESOURCE UTILIZATION SLOs
###############################################################################

resource_utilization:
  # CPU utilization
  - name: cpu_utilization_p95
    display_name: CPU Utilization P95
    description: 95th percentile CPU utilization
    target: 0.70
    window: 1h
    alert_threshold: 0.85
    action_threshold: 0.95
    measurement:
      type: percentile
      percentile: 95
      metric: system.cpu.usage
    tags:
      - capacity
      - infrastructure

  # Memory utilization
  - name: memory_utilization_p95
    display_name: Memory Utilization P95
    description: 95th percentile memory utilization
    target: 0.80
    window: 1h
    alert_threshold: 0.90
    action_threshold: 0.95
    measurement:
      type: percentile
      percentile: 95
      metric: jvm.memory.used
    tags:
      - capacity
      - infrastructure

  # Database connection pool utilization
  - name: db_connection_pool_utilization
    display_name: Database Connection Pool Utilization
    description: Average database connection pool usage
    target: 0.70
    window: 5m
    alert_threshold: 0.85
    action_threshold: 0.95
    measurement:
      type: average
      metric: hikari.pool.active.connections
    tags:
      - database
      - capacity

###############################################################################
# CANARY DEPLOYMENT SLOs
###############################################################################

canary:
  # Canary comparison threshold
  - name: canary_fraud_score_deviation
    display_name: Canary Fraud Score Deviation
    description: Maximum allowed deviation in fraud scores between canary and baseline
    target: 0.02  # 2%
    window: 1h
    alert_threshold: 0.05
    action_threshold: 0.10
    measurement:
      type: custom
      metric: canary.fraud.score.deviation
    tags:
      - canary
      - deployment

  # Canary error rate comparison
  - name: canary_error_rate_ratio
    display_name: Canary Error Rate Ratio
    description: Ratio of canary error rate to baseline error rate
    target: 1.0
    window: 1h
    alert_threshold: 1.5
    action_threshold: 2.0
    measurement:
      type: ratio
      numerator: canary.error.rate
      denominator: baseline.error.rate
    tags:
      - canary
      - deployment

###############################################################################
# ROLLBACK TRIGGERS
###############################################################################

rollback_triggers:
  # Immediate rollback conditions
  - name: critical_error_spike
    condition: error_rate > 0.05 AND duration > 1m
    action: immediate_rollback

  - name: latency_degradation
    condition: p99_latency > 2000ms AND duration > 5m
    action: immediate_rollback

  - name: tenant_isolation_breach
    condition: cross_tenant_leak_rate > 0
    action: immediate_rollback

  - name: availability_drop
    condition: availability < 0.950 AND duration > 2m
    action: immediate_rollback

###############################################################################
# NOTIFICATION RULES
###############################################################################

notifications:
  - slo_name: overall_availability
    alert_level: warning
    channels:
      - slack: #platform-alerts
      - pagerduty: platform-team

  - slo_name: fraud_detection_p95_latency
    alert_level: warning
    channels:
      - slack: #performance-alerts

  - slo_name: cross_tenant_leak_rate
    alert_level: critical
    channels:
      - slack: #security-emergency
      - pagerduty: security-team
      - email: security@gogidix.com
