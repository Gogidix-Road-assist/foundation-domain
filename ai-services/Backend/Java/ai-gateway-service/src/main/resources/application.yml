spring:
  application:
    name: ai-gateway-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:rapid_assist_ai_gateway_service}
      auto-index-creation: true
      repositories:
        enabled: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ai-gateway-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

# Resilience4j Configuration
resilience4j:
  ratelimiter:
    instances:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0
        register-health-indicator: true

  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 10
        minimum-number-of-calls: 5
        register-health-indicator: true

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,rateLimiters
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true

# Logging
logging:
  level:
    root: INFO
    com.gogidix.rapidassist.ai.gateway: DEBUG
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Gateway Configuration
gateway:
  rate-limit:
    default-requests-per-minute: 60
    default-burst-capacity: 100
  circuit-breaker:
    failure-threshold: 50
    timeout: 30000
  cache:
    route-cache-ttl: 300
    api-key-cache-ttl: 600

# Kafka Topics
kafka:
  topic:
    gateway:
      request: gateway.request
      response: gateway.response
      error: gateway.error
      metrics: gateway.metrics

# ============================================================
# Development Profile
# ============================================================
---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.gogidix.rapidassist: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.cache: DEBUG

# ============================================================
# Test Configuration (with Embedded MongoDB)
# ============================================================
---
spring:
  config:
    activate:
      on-profile: test
  data:
    mongodb:
      uri: mongodb://localhost:27017/rapid_assist_ai_gateway_service_test

logging:
  level:
    com.gogidix.rapidassist: DEBUG
    org.springframework.data.mongodb: DEBUG

# ============================================================
# Production Profile
# ============================================================
---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    com.gogidix.rapidassist: INFO

# OpenAPI disabled in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
