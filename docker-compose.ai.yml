# Foundation-Domain AI Services Docker Compose
# This file contains all 31 AI services
# Usage: docker-compose -f docker-compose.yml -f docker-compose.ai.yml up -d

version: '3.8'

services:
  # AI Gateway - Central entry point for all AI services
  ai-gateway-service:
    build:
      context: ./ai-services/Backend/Java/ai-gateway-service
      dockerfile: Dockerfile
    container_name: foundation-ai-gateway
    ports:
      - "8200:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URL: mongodb://admin:password123@foundation-mongodb:27017
      REDIS_URL: redis://foundation-redis:6379
    depends_on:
      - foundation-mongodb
      - foundation-redis
    networks:
      - foundation-network
    restart: unless-stopped

